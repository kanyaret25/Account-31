<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>💰 ระบบบัญชีเครดิต</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Nunito:wght@700;800;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    #boot-status{position:fixed;inset:0;background:#ffe4eb;display:flex;align-items:center;
      justify-content:center;z-index:99999;font-family:'Mitr','Sarabun',sans-serif;text-align:center;padding:20px}
    #boot-box{background:#fff;border-radius:20px;padding:28px 24px;max-width:360px;
      box-shadow:0 20px 60px rgba(224,122,143,.25)}
    #boot-title{font-weight:800;color:#8c5a65;font-size:15px;margin-bottom:8px}
    #boot-msg{font-size:12px;color:#b07d89;line-height:1.6;word-break:break-word}
    #boot-btn{margin-top:14px;background:linear-gradient(135deg,#e07a8f,#ffb5c6);color:#fff;
      border:none;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:13px}
  </style>
  <style>
    :root{
      --bg:#ffe4eb; --text:#8c5a65; --text-sub:#b07d89;
      --card-bg:rgba(255,255,255,0.96); --card-shadow:0 2px 16px rgba(255,120,150,.10),0 1px 3px rgba(200,80,100,.05);
      --card-shadow-hover:0 6px 24px rgba(255,120,150,.16),0 2px 6px rgba(200,80,100,.07);
      --scrollbar-track:#fff0f3; --scrollbar-thumb:#ff9eaa;
      --hdr-grad:linear-gradient(135deg,#e07a8f,#ffb5c6);
      --inp-border:#ffdce3; --inp-bg:#fff; --inp-text:#8c5a65; --inp-focus:#ff9eaa;
      --modal-bg:rgba(255,255,255,0.98); --modal-shadow:0 32px 80px rgba(200,80,120,.2),0 4px 20px rgba(200,80,120,.08);
      --overlay:#0009;
      --accent-hue:330; /* ชมพู (ค่าเริ่มต้น) — ใช้กับ filter:hue-rotate() ปรับโทนสีทั้งแอปโดยไม่ต้องแก้ inline style */
    }
    body[data-theme="dark"]{
      --bg:#1a1420; --text:#f3e4ea; --text-sub:#c9a0b0;
      --card-bg:rgba(42,32,48,0.96); --card-shadow:0 2px 16px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2);
      --card-shadow-hover:0 6px 24px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.25);
      --scrollbar-track:#2a2030; --scrollbar-thumb:#c9678a;
      --hdr-grad:linear-gradient(135deg,#7a3a52,#4a2438);
      --inp-border:#4a3648; --inp-bg:#241b2a; --inp-text:#f3e4ea; --inp-focus:#c9678a;
      --modal-bg:rgba(36,27,42,0.98); --modal-shadow:0 32px 80px rgba(0,0,0,.5),0 4px 20px rgba(0,0,0,.3);
      --overlay:#000c;
    }
    /* ── DARK MODE: บังคับสีตัวอักษรเนื้อหา (inline style) ให้เข้ากับพื้นเข้ม ──
       ครอบคลุมสีที่ระบบใช้บ่อยที่สุด: น้ำตาลเข้ม/อ่อน (ตัวอักษรหลัก), ขาว (พื้นหลังการ์ด/input) */
    body[data-theme="dark"] [style*="color:#8c5a65"],
    body[data-theme="dark"] [style*="color: #8c5a65"]{color:#f3e4ea!important}
    body[data-theme="dark"] [style*="color:#b07d89"],
    body[data-theme="dark"] [style*="color: #b07d89"]{color:#c9a0b0!important}
    body[data-theme="dark"] [style*="background:#fff"i]:not([class*="btn"]):not([class*="tag"]):not([class*="pill"]),
    body[data-theme="dark"] [style*="background: #fff"i]:not([class*="btn"]):not([class*="tag"]):not([class*="pill"]){
      background:#241b2a!important;color:#f3e4ea}
    body[data-theme="dark"] [style*="background:#fff0f3"],
    body[data-theme="dark"] [style*="background: #fff0f3"]{background:#2a2030!important}
    body[data-theme="dark"] [style*="border:1px solid #ffdce3"],
    body[data-theme="dark"] [style*="border: 1px solid #ffdce3"]{border-color:#4a3648!important}
    body[data-theme="dark"] table{color:#f3e4ea}
    body[data-theme="dark"] th{color:#c9a0b0!important}

    /* ── ธีมสี (Accent Color): หมุนโทนสีทั้งแอปด้วย hue-rotate ──
       เทคนิคนี้ปรับได้ทุกจุดที่มีสีชมพู/ส้มพาสเทลในระบบ (ปุ่ม, การ์ด, ไอคอน, กราฟ ฯลฯ)
       โดยไม่ต้องไล่แก้ inline style นับพันจุด — ปลอดภัยต่อโค้ดเดิม 100%
       ค่า hue-rotate คำนวณจากค่าตั้งต้นของระบบ (สีชมพู hue≈330) เทียบกับสีเป้าหมาย */
    body[data-accent="pink"] #root{filter:none} /* ค่าเริ่มต้น ไม่ต้องหมุนสี */
    body[data-accent="blue"]   #root{filter:hue-rotate(155deg)}
    body[data-accent="green"]  #root{filter:hue-rotate(105deg)}
    body[data-accent="purple"] #root{filter:hue-rotate(50deg)}
    body[data-accent="orange"] #root{filter:hue-rotate(-45deg)}
    body[data-accent="red"]    #root{filter:hue-rotate(-25deg)}
    body[data-accent="teal"]   #root{filter:hue-rotate(130deg)}
    #root{transition:filter .3s}

    /* ═══════════════════════════════════════════════════════════════
       🎨 THEME PRESET SYSTEM — ธีมเต็มรูปแบบ 3 แบบ (data-preset attribute)
       แยกอิสระจาก data-theme (light/dark) และ data-accent (หมุนสี) เดิม
       ใช้เทคนิคเดียวกับ dark mode: CSS attribute-selector บังคับ font/radius/shadow
       โดยไม่แตะ inline style ของ component ใดๆ เลย — ปลอดภัยกับ login/Firebase 100%
       ═══════════════════════════════════════════════════════════════ */

    /* ── Preset 1: Pink Cute (ค่าเริ่มต้นของระบบ) — ไม่ต้อง override อะไร ── */

    /* ── Preset 2: Warm Payment — อิงจากหน้า "Pinkjulieland Payment" (ครีม+ชมพู, ฟอนต์ Prompt, จุดลายจุด, มุมโค้งมาก) ── */
    body[data-preset="warm"]{
      --bg:#fdf5ee; --text:#7a5743; --text-sub:#9d755d;
      --card-bg:#ffffff; --card-shadow:0 4px 20px -2px rgba(249,168,212,.3);
      --card-shadow-hover:0 10px 25px -5px rgba(249,168,212,.4);
      --scrollbar-track:#fdf5ee; --scrollbar-thumb:#f9a8d4;
      --hdr-grad:linear-gradient(135deg,#f472b6,#fbcfe8);
      --inp-border:#fbcfe8; --inp-bg:#fffdfa; --inp-text:#7a5743; --inp-focus:#f9a8d4;
      --modal-bg:#ffffff; --modal-shadow:0 20px 50px rgba(249,168,212,.35);
      --overlay:#4a2f1d66;
      font-family:'Prompt',sans-serif!important;
      background-image:radial-gradient(#fbcfe8 1px,transparent 1px)!important;
      background-size:20px 20px!important;
    }
    body[data-preset="warm"] .card,
    body[data-preset="warm"] .modal-box{border-radius:24px!important}
    body[data-preset="warm"] .btn,
    body[data-preset="warm"] .inp{border-radius:16px!important}
    body[data-preset="warm"] [style*="color:#8c5a65"],
    body[data-preset="warm"] [style*="color: #8c5a65"]{color:#7a5743!important}
    body[data-preset="warm"] [style*="color:#b07d89"],
    body[data-preset="warm"] [style*="color: #b07d89"]{color:#9d755d!important}
    body[data-preset="warm"] [style*="background:#fff0f3"],
    body[data-preset="warm"] [style*="background: #fff0f3"]{background:#fdf5ee!important}
    body[data-preset="warm"] [style*="border:1px solid #ffdce3"],
    body[data-preset="warm"] [style*="border: 1px solid #ffdce3"]{border-color:#fbcfe8!important}
    body[data-preset="warm"] .hdr{background:linear-gradient(135deg,#f472b6,#fbcfe8)!important}

    /* ── Preset 3: Cream Teddy — อิงจากหน้าร้าน Pinkjulieland (ครีม+น้ำตาล, ฟอนต์ Mitr, มุมโค้งมาก, โทนอบอุ่น) ── */
    body[data-preset="teddy"]{
      --bg:#FFFBF0; --text:#6B4423; --text-sub:#A0522D;
      --card-bg:#ffffff; --card-shadow:0 10px 25px -5px rgba(255,182,193,.2);
      --card-shadow-hover:0 10px 25px -5px rgba(255,182,193,.35);
      --scrollbar-track:#FFFBF0; --scrollbar-thumb:#FFB6C1;
      --hdr-grad:linear-gradient(135deg,#FFE4E1,#FFFBF0);
      --inp-border:#FFE4E1; --inp-bg:#FFFBF0; --inp-text:#6B4423; --inp-focus:#FFB6C1;
      --modal-bg:#ffffff; --modal-shadow:0 20px 50px rgba(107,68,35,.25);
      --overlay:#4A2F1D80;
      font-family:'Mitr',sans-serif!important;
    }
    body[data-preset="teddy"] .card,
    body[data-preset="teddy"] .modal-box{border-radius:30px!important;border:2px solid #FFE4E1!important}
    body[data-preset="teddy"] .btn,
    body[data-preset="teddy"] .inp{border-radius:18px!important}
    body[data-preset="teddy"] [style*="color:#8c5a65"],
    body[data-preset="teddy"] [style*="color: #8c5a65"]{color:#6B4423!important}
    body[data-preset="teddy"] [style*="color:#b07d89"],
    body[data-preset="teddy"] [style*="color: #b07d89"]{color:#A0522D!important}
    body[data-preset="teddy"] [style*="background:#fff0f3"],
    body[data-preset="teddy"] [style*="background: #fff0f3"]{background:#FFFBF0!important}
    body[data-preset="teddy"] [style*="border:1px solid #ffdce3"],
    body[data-preset="teddy"] [style*="border: 1px solid #ffdce3"]{border-color:#FFE4E1!important}
    body[data-preset="teddy"] .hdr{background:linear-gradient(135deg,#FF91A4,#FFB6C1)!important}
  </style>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Mitr','Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
    input,select,button,textarea{font-family:inherit}
    .num{font-family:'Nunito','Mitr',sans-serif}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--scrollbar-track)}
    ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:10px}
    .tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:0}
    .tabs::-webkit-scrollbar{display:none}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .in{animation:up .2s ease}

    /* ── CARD : glassmorphism ชมพู modern ── */
    .card{
      background:var(--card-bg);
      border-radius:20px;
      box-shadow:var(--card-shadow);
      border:none;
      overflow:hidden;
      backdrop-filter:blur(4px);
      transition:background .25s,box-shadow .25s;
    }
    .card-p{padding:14px 16px}
    .card:hover{box-shadow:var(--card-shadow-hover);transition:box-shadow .2s}

    /* ── BADGE ── */
    .notif{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border-radius:50%;
      width:15px;height:15px;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}

    /* ── GRADIENT HEADER ── */
    .hdr{background:var(--hdr-grad);color:#fff;transition:background .25s}

    /* ── PILL ── */
    .pill{border-radius:999px;padding:3px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}

    /* ── TAG ── */
    .tag{border-radius:8px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block}

    /* ── INPUT : ขอบชมพูอ่อน พร้อม focus glow ── */
    .inp{
      width:100%;padding:10px 13px;
      border:1.5px solid var(--inp-border);
      border-radius:12px;font-size:13px;outline:none;
      background:var(--inp-bg);color:var(--inp-text);
      transition:border .15s,box-shadow .15s,background .25s,color .25s;
    }
    .inp:focus{border-color:var(--inp-focus);box-shadow:0 0 0 3px rgba(255,158,170,.15)}
    .lbl{display:block;font-size:11px;color:var(--text-sub);font-weight:600;margin-bottom:4px}
    .row{margin-bottom:12px}

    /* ── BTN : โค้งมน ไม่มีขอบแข็ง ── */
    .btn{
      border:none;border-radius:12px;padding:10px 18px;
      font-size:13px;font-weight:700;cursor:pointer;
      transition:all .15s;white-space:nowrap;letter-spacing:.2px;
    }
    .btn:hover{opacity:.88;transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn-sm{padding:5px 12px;font-size:11px;border-radius:9px}
    .btn-full{width:100%}

    /* ── MODAL ── */
    .overlay{position:fixed;inset:0;background:var(--overlay);z-index:999;display:flex;align-items:center;justify-content:center;padding:12px}
    .modal-box{
      background:var(--modal-bg);
      border-radius:28px;width:100%;
      max-width:540px;max-height:93vh;overflow-y:auto;
      box-shadow:var(--modal-shadow);
      border:none;
      transition:background .25s;
    }
    .modal-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:18px 20px 14px;
      background:var(--hdr-grad);
      color:#fff;
      position:sticky;top:0;z-index:1;border-radius:28px 28px 0 0;
    }
    .modal-body{padding:16px 20px 24px}

    /* ── PROGRESS ── */
    .bar-track{background:#ffe4eb;border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;transition:width .4s}

    /* ── INFO ROW ── */
    .info-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #fff0f3}
    .info-label{font-size:11px;color:#b07d89;min-width:100px;padding-top:1px;flex-shrink:0}
    .info-val{font-size:13px;font-weight:600;color:#8c5a65;flex:1;word-break:break-all}

    /* ── TABLE ── */
    .tbl{width:100%;border-collapse:collapse;font-size:12px}
    .tbl th{padding:7px 8px;text-align:left;color:#b07d89;font-weight:700;
      border-bottom:2px solid #ffdce3;background:linear-gradient(to bottom,#fff5f7,#fffafb)}
    .tbl td{padding:6px 8px;border-bottom:1px solid #fff0f3;color:#8c5a65}
    .tbl tr:hover td{background:#fffafb}

    /* ── GRID helpers ── */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

    /* ── SECTION TITLE chip ── */
    .sec-title{
      display:inline-flex;align-items:center;gap:6px;
      background:linear-gradient(135deg,#ff9eaa22,#ffcdb215);
      border:1px solid #ffdce3;border-radius:10px;
      padding:4px 12px;font-size:12px;font-weight:700;color:#e07a8f;margin-bottom:10px;
    }

    /* ── Divider ── */
    .divider{height:1px;background:linear-gradient(to right,transparent,#ffdce3,transparent);margin:10px 0}
  </style>
</head>
<body>
<div id="root"></div>

<!-- ═══ หน้าจอสถานะเริ่มต้น: แสดงระหว่างรอ CDN โหลด และดักจับ error ระดับ script ทั้งหมด ═══
     สำคัญมาก: ถ้า React/ReactDOM/Babel โหลดไม่สำเร็จ (เน็ตช้า/CDN ล่ม) โค้ด JSX ด้านล่าง
     จะ throw error ทันทีตอน parse (เช่น "Cannot destructure property of undefined")
     ซึ่งเกิดก่อนที่ React หรือ ErrorBoundary จะทำงานได้เลย ทำให้กลายเป็นจอขาวเปล่าไม่มีคำอธิบาย
     window.onerror ด้านล่างนี้จะจับ error ระดับนี้ไว้แทน แสดงข้อความที่เข้าใจได้ให้ผู้ใช้เห็น -->
<div id="boot-status">
  <div id="boot-box">
    <div style="font-size:36px;margin-bottom:10px">⏳</div>
    <div id="boot-title">กำลังโหลดระบบ...</div>
    <div id="boot-msg">กรุณารอสักครู่</div>
  </div>
</div>
<script>
  window.onerror = function(msg, src, line, col, err){
    var box = document.getElementById('boot-status');
    if(box){
      box.style.display = 'flex';
      document.getElementById('boot-title').textContent = '⚠️ โหลดระบบไม่สำเร็จ';
      document.getElementById('boot-msg').innerHTML =
        'สาเหตุ: ' + (msg||'ไม่ทราบสาเหตุ') +
        '<br><br>มักเกิดจากอินเทอร์เน็ตช้าตอนโหลดครั้งแรก ทำให้ไลบรารีที่จำเป็น (React/Babel) โหลดไม่ทัน' +
        '<br><br>ลองกดโหลดหน้าใหม่อีกครั้ง';
      var btn = document.createElement('button');
      btn.id = 'boot-btn';
      btn.textContent = '🔄 โหลดหน้าใหม่';
      btn.onclick = function(){ location.reload(); };
      document.getElementById('boot-box').appendChild(btn);
    }
    return false; // ยังให้ error ขึ้น console ปกติเพื่อ debug ได้
  };
  // ซ่อนหน้าจอ "กำลังโหลด" เมื่อ React mount สำเร็จแล้วจริงๆ (ดูจุดที่เรียก hideBootStatus() ท้ายไฟล์)
  window.hideBootStatus = function(){
    var box = document.getElementById('boot-status');
    if(box) box.remove();
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- ── ตรวจสอบว่า CDN หลัก (React/ReactDOM/Babel) โหลดสำเร็จจริงก่อนรัน JSX ──
     ป้องกัน "Cannot destructure property of undefined" ตอน const{useState}=React
     ถ้าโหลดไม่สำเร็จภายใน 10 วิ จะแสดงข้อความแจ้งเตือนที่ชัดเจนแทนจอขาว -->
<script>
  (function waitForCoreLibs(attempt){
    attempt = attempt || 0;
    if(window.React && window.ReactDOM && window.Babel){
      return; // พร้อมแล้ว ปล่อยให้ script ถัดไป (type=text/babel) ทำงานตามปกติ
    }
    if(attempt >= 40){ // รอสูงสุด ~10 วินาที (40 × 250ms)
      var missing = [];
      if(!window.React) missing.push("React");
      if(!window.ReactDOM) missing.push("ReactDOM");
      if(!window.Babel) missing.push("Babel");
      document.getElementById('boot-title').textContent = '⚠️ โหลดไลบรารีไม่สำเร็จ';
      document.getElementById('boot-msg').innerHTML =
        'โหลด <b>' + missing.join(', ') + '</b> จาก CDN ไม่สำเร็จ' +
        '<br><br>กรุณาตรวจสอบอินเทอร์เน็ต หรือลองเปลี่ยนเครือข่าย แล้วโหลดหน้าใหม่';
      var btn = document.createElement('button');
      btn.id = 'boot-btn';
      btn.textContent = '🔄 โหลดหน้าใหม่';
      btn.onclick = function(){ location.reload(); };
      document.getElementById('boot-box').appendChild(btn);
      return;
    }
    setTimeout(function(){ waitForCoreLibs(attempt+1); }, 250);
  })();
</script>

<!-- ═══════════════════════════════════════════════════════════
     🔥 FIREBASE CONFIG — ต้องแก้ค่าด้านล่างก่อนใช้งานจริง
     วิธีดู: Firebase Console → Project Settings → General → SDK setup and configuration → Config
     ═══════════════════════════════════════════════════════════ -->
<script>
  const FIREBASE_CONFIG = {

<script type="text/babel">const {useState,useMemo,useEffect,useCallback}=React;
const CT=[
  {v:"bad_debt",    l:"เครดิตเสีย",           c:"#ef4444"},
  {v:"loan",        l:"เครดิตเงินกู้",         c:"#f97316"},
  {v:"scan_outside",l:"สแกนของนอกร้าน",       c:"#a855f7"},
  {v:"in_store",    l:"ซื้อของร้าน (เครดิต)", c:"#ff9eaa"},
];
const PAY_MODES=[
  {v:"principal_interest",l:"ต้น + ดอก (ปกติ)"},
  {v:"interest_only",     l:"จ่ายแต่ดอก"},
  {v:"custom_schedule",   l:"กำหนดวันเองรายครั้ง"},
];
const FREQ=[
  {v:"daily",l:"รายวัน (ทุก 1 วัน)"},
  {v:"3",l:"ทุก 3 วัน"},
  {v:"5",l:"ทุก 5 วัน"},
  {v:"weekly",l:"รายสัปดาห์ (ทุก 7 วัน)"},
  {v:"15",l:"ทุก 15 วัน"},
  {v:"30",l:"ทุก 30 วัน"},
  {v:"monthly",l:"รายเดือน"},
  {v:"custom",l:"กำหนดเองแต่ละครั้ง"},
];
const MO=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const td=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Math.round(n||0).toLocaleString("th-TH");
const thD=iso=>{if(!iso)return"-";const[y,m,d]=iso.split("-");return`${+d} ${MO[+m-1]} ${+y+543}`};
const mKey=iso=>iso?iso.slice(0,7):"";
const mLbl=k=>{if(!k)return"";const[y,m]=k.split("-");return`${MO[+m-1]} ${+y+543}`};
const addD=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addM=(iso,n)=>{const d=new Date(iso);d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const addW=(iso,n)=>addD(iso,n*7);
// ── ระบบเก็บข้อมูล: localStorage (backup ทันที) + Firestore (sync ข้ามเครื่อง) ──
// load()/save() ยังเรียกแบบ synchronous เหมือนเดิมทุกจุดในแอป ไม่ต้องแก้โค้ดส่วนอื่น
// โดยใช้ fbCache เป็นตัวกลาง: โหลดจาก Firestore มาใส่ cache ตอน login สำเร็จ (ดู loadAllFromFirestore)
window._fbCache = {};
window._fbUid = null; // uid ปัจจุบัน ถ้า null = ยังไม่ได้ login กับ Firebase (ใช้ localStorage อย่างเดียว)
const FIRESTORE_KEYS = ["customers","debts","payments","sales","cashTxns","bills"]; // เฉพาะข้อมูลธุรกิจที่ต้อง sync ข้ามเครื่อง

const save=(k,v)=>{
  try{localStorage.setItem("cb3_"+k,JSON.stringify(v))}catch(_){}
  window._fbCache[k]=v;
  // sync ขึ้น Firestore เฉพาะ key ที่เป็นข้อมูลธุรกิจ และต้อง login แล้วเท่านั้น
  if(window._fbUid && FIRESTORE_KEYS.includes(k) && window.fbDb){
    window.fbDb.collection("users").doc(window._fbUid).collection("data").doc(k)
      .set({value:v,updatedAt:Date.now()})
      .catch(e=>console.warn("Firestore sync failed for",k,e));
  }
};
const load=(k,fb)=>{
  if(k in window._fbCache)return window._fbCache[k];
  try{const r=localStorage.getItem("cb3_"+k);const v=r?JSON.parse(r):fb;window._fbCache[k]=v;return v;}
  catch(_){return fb}
};
// โหลดข้อมูลทั้งหมดจาก Firestore มาใส่ cache — เรียกครั้งเดียวหลัง login สำเร็จ
async function loadAllFromFirestore(uid){
  window._fbUid=uid;
  for(const k of FIRESTORE_KEYS){
    try{
      const doc=await window.fbDb.collection("users").doc(uid).collection("data").doc(k).get();
      if(doc.exists){
        const remote=doc.data().value;
        window._fbCache[k]=remote;
        localStorage.setItem("cb3_"+k,JSON.stringify(remote)); // อัปเดต local backup ด้วย
      }else{
        // ยังไม่เคยมีข้อมูลบน Firestore — ใช้ของ local เดิม (ถ้ามี) แล้วอัปโหลดขึ้นไปตั้งต้น
        const local=load(k,FIRESTORE_KEYS.includes(k)?[]:null);
        if(local && local.length>0){
          await window.fbDb.collection("users").doc(uid).collection("data").doc(k)
            .set({value:local,updatedAt:Date.now()});
        }
      }
    }catch(e){console.warn("โหลด",k,"จาก Firestore ไม่สำเร็จ ใช้ข้อมูลเครื่องนี้แทน",e);}
  }
}
function calcSplit(d){
  const pM=Math.max(0,+d.principalMom||0),pU=Math.max(0,+d.principalUs||0);
  const cp=Math.max(1,+d.creditPrice||1),mr=Math.min(1,Math.max(0,d.momProfitRatio??0.5));
  const profit=Math.max(0,cp-Math.min(pM+pU,cp));
  return{momRatio:pM/cp,usRatio:pU/cp,momProfitRatio:(profit*mr)/cp,usProfitRatio:(profit*(1-mr))/cp};
}
const TIER=[
  {min:850,label:"แพลตินัม 🏆",color:"#a855f7",bg:"#f5f3ff"},
  {min:700,label:"ทอง ⭐",     color:"#f59e0b",bg:"#fffbeb"},
  {min:550,label:"เงิน 🥈",    color:"#64748b",bg:"#f8fafc"},
  {min:350,label:"บรอนซ์ 🥉",  color:"#f97316",bg:"#fff7ed"},
  {min:0,  label:"ต้องปรับปรุง ⚠️",color:"#ef4444",bg:"#fef2f2"},
];
function getTier(s){return TIER.find(t=>s>=t.min)||TIER[TIER.length-1];}
function calcScore(debts,payments,schedules){
  if(!debts.length)return{score:null,onTime:0,early:0,late:0,missed:0,total:0,pct:null};
  let onTime=0,early=0,late=0,missed=0;
  const now=td();
  debts.forEach(d=>{
    const sc=schedules[d.id]||[];
    const paid=payments.filter(p=>p.debtId===d.id).sort((a,b)=>a.date.localeCompare(b.date));
    // ── ใช้ยอดสะสมแบบเดียวกับ getOverdue เพื่อความสอดคล้อง ──
    // แก้บั๊ก: เดิมเช็ค p.date===s.date เป๊ะๆ ทำให้คนจ่ายก่อนกำหนด (early) ไม่ถูกนับว่าตรงเวลา
    // กลายเป็นโดนตัดคะแนนเหมือนขาดชำระ ทั้งที่จริงควรได้คะแนนดีกว่าคนจ่ายตรงวันด้วยซ้ำ
    let paidCum=0;
    const dueList=sc.filter(s=>s.date<=now).sort((a,b)=>a.date.localeCompare(b.date));
    dueList.forEach(s=>{
      // หา payment ที่ตกลงมาถึงงวดนี้ (สะสมตามลำดับเวลา)
      const payUpTo=paid.filter(p=>p.date<=s.date).reduce((a,p)=>a+p.amount,0);
      const stillOwed=s.amtDue-(payUpTo-paidCum);
      if(stillOwed<=0){
        // จ่ายครบงวดนี้แล้ว — เช็คว่าจ่ายก่อนวันนัดกี่วัน
        const payingTxn=paid.find(p=>p.date<=s.date&&(paid.filter(x=>x.date<=p.date).reduce((a,x)=>a+x.amount,0))>=paidCum+s.amtDue);
        if(payingTxn&&payingTxn.date<s.date)early++;else onTime++;
        paidCum+=s.amtDue;
      }else{
        const lateP=paid.find(p=>p.date>s.date&&p.date<=addD(s.date,7));
        if(lateP)late++;else missed++;
      }
    });
  });
  const total=onTime+early+late+missed;
  if(!total)return{score:null,onTime,early,late,missed,total:0,pct:null};
  // early ได้คะแนนเต็ม 100 เท่า onTime, late ได้ครึ่งเดียว, missed ได้ 0
  const behavPct=((onTime*100)+(early*100)+(late*50))/total;
  const expBonus=Math.min(200,total*5);
  const earlyBonus=Math.min(50,early*3); // โบนัสพิเศษสำหรับวินัยจ่ายก่อนกำหนด
  const raw=Math.round((behavPct/100)*800)+expBonus+earlyBonus;
  const score=Math.min(1000,Math.max(0,raw));
  const pct=total>0?Math.round(((onTime+early)/total)*100):null;
  return{score,onTime,early,late,missed,total,pct};
}
function calcRisk(cust,debts,scoreData){
  const risks=[];let riskScore=0;
  if(scoreData.score!==null){
    if(scoreData.score<350){risks.push("คะแนนเครดิตต่ำมาก");riskScore+=40;}
    else if(scoreData.score<550){risks.push("คะแนนเครดิตต่ำกว่าเกณฑ์");riskScore+=20;}
  }
  const totalDebt=debts.reduce((a,d)=>a+(+d.creditPrice||0),0);
  const income=+cust?.income||0;
  if(income>0&&totalDebt>income*6){risks.push("ภาระหนี้สูงเกิน 6 เท่าของรายได้");riskScore+=30;}
  if(scoreData.total>0){
    const missedPct=(scoreData.missed/scoreData.total)*100;
    if(missedPct>30){risks.push(`ขาดชำระ ${Math.round(missedPct)}% ของงวดทั้งหมด`);riskScore+=30;}
  }
  if(cust?.occupation==="ไม่มีงานทำ"){risks.push("ไม่มีรายได้ประจำ");riskScore+=15;}
  const level=riskScore>=60?"สูงมาก":riskScore>=40?"สูง":riskScore>=20?"ปานกลาง":"ต่ำ";
  const color=riskScore>=60?"#ef4444":riskScore>=40?"#f97316":riskScore>=20?"#f59e0b":"#10b981";
  const baseLimit=income>0?income*2:5000;
  const adjLimit=scoreData.score?Math.round(baseLimit*(scoreData.score/1000)*1.5):baseLimit;
  const limitStr=`฿${Math.round(adjLimit/1000)*1000}`.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return{risks,riskScore,level,color,limitStr};
}
// ── แปลงค่า freq เป็น "จำนวนวัน" (interval) ──
// รองรับทั้งตัวเลขตรงๆ (3,5,7,15,30 วัน) และค่า string เดิมที่เคยบันทึกไว้ (เข้ากันได้กับข้อมูลเก่าใน Firestore)
// "monthly" ใช้วิธีคำนวณแบบเดือนจริง (addM) แยกต่างหาก เพราะเดือนมีจำนวนวันไม่เท่ากัน
function freqToDays(freq){
  if(freq==="daily")return 1;
  if(freq==="weekly")return 7;
  if(freq==="monthly"||freq==="custom")return null; // ใช้ logic แยก (addM หรือ customDates)
  const n=+freq; // รองรับทั้งตัวเลขจริงและ numeric-string จาก <select> (เช่น "3","5","7","15","30")
  return Number.isFinite(n)&&n>0?n:null;
}
function buildSchedule(debt,payments){
  const sc=debt.schedule;if(!sc||!sc.startDate)return[];
  if(sc.freq==="custom")return(sc.customDates||[]).map(cd=>({date:cd.date,amtDue:cd.amount,label:cd.label||"",type:sc.payMode,debtId:debt.id}));
  // ── horizon ขยายเป็น 400 วัน (~13 เดือน) เพื่อให้ปฏิทินเลื่อนดูเดือนก่อน/หลังได้จริง ──
  const result=[];const horizon=addD(td(),400);
  // ── ปรับวันเริ่มต้นตาม payDay ถ้ามีการกำหนดวันจ่ายเอง (เฉพาะกรณีความถี่รายเดือน) ──
  let cur=sc.startDate;
  if(debt.payDay&&sc.freq==="monthly"){
    const d=new Date(cur);
    const target=Math.min(debt.payDay,28); // กัน edge case เดือนก.พ./เดือนสั้น
    d.setDate(target);
    if(d<new Date(cur))d.setMonth(d.getMonth()+1); // ถ้าวันที่กำหนดผ่านไปแล้วในเดือนเริ่มต้น เลื่อนไปเดือนถัดไป
    cur=d.toISOString().slice(0,10);
  }
  const dayInterval=freqToDays(sc.freq); // null = รายเดือน (ใช้ addM แทน)
  let idx=0;
  while(cur<=horizon&&idx<500){
    const amt=sc.payMode==="interest_only"?+(debt.interestAmt||0):+(debt.creditPrice/(debt.totalInstallments||1)).toFixed(2);
    result.push({date:cur,amtDue:amt,type:sc.payMode,debtId:debt.id,idx});
    if(dayInterval!==null)cur=addD(cur,dayInterval); // ทุก N วัน (3/5/7/15/30/...)
    else cur=addM(cur,1); // รายเดือน
    idx++;
    if(idx>=(debt.totalInstallments||999)&&sc.payMode!=="interest_only")break;
  }
  return result;
}
function getOverdue(debt,schedule,payments,asOf){
  if(!schedule.length)return[];
  // ── คำนวณจากยอดสะสม ไม่ใช่วันที่ตรงเป๊ะ ──
  // แก้บั๊ก: เดิมเช็คว่ามี payment ที่ "วันที่ตรงกับวันนัด" เท่านั้นถึงจะถือว่าจ่ายแล้ว
  // ทำให้ลูกหนี้ที่จ่ายก่อนกำหนด (คนละวันกับตาราง) ยังถูกฟ้องว่าค้างอยู่ ทั้งที่จ่ายจริงแล้ว
  // ตอนนี้: เทียบ "ยอดที่จ่ายสะสมทั้งหมด" กับ "ยอดที่ควรจ่ายสะสมถึงวันนี้ตามตาราง"
  const paidTotal=payments.filter(p=>p.debtId===debt.id&&p.date<=asOf).reduce((a,p)=>a+p.amount,0);
  const dueSchedule=schedule.filter(s=>s.date<=asOf).sort((a,b)=>a.date.localeCompare(b.date));
  let cumDue=0,remaining=paidTotal,overdue=[];
  for(const s of dueSchedule){
    cumDue+=s.amtDue;
    if(remaining>=s.amtDue){remaining-=s.amtDue;} // งวดนี้จ่ายครบแล้ว (อาจจ่ายก่อนกำหนดหรือรวมงวด)
    else{overdue.push({...s,amtDue:s.amtDue-remaining});remaining=0;}
  }
  return overdue;
}
function ScoreRing({score,size=110}){
  if(score===null)return(
    <div style={{textAlign:"center",padding:12}}>
      <div style={{fontSize:28,marginBottom:4}}>🔲</div>
      <div style={{fontSize:11,color:"#b07d89"}}>ยังไม่มีข้อมูลการชำระ</div>
    </div>
  );
  const tier=getTier(score);
  const r=40,circ=2*Math.PI*r;
  const pct=score/1000;
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <div style={{position:"relative",width:size,height:size}}>
        <svg width={size} height={size} viewBox="0 0 96 96">
          {/* track */}
          <circle cx="48" cy="48" r={r} fill="none" stroke="#fff0f3" strokeWidth="9"/>
          {/* fill */}
          <circle cx="48" cy="48" r={r} fill="none" stroke={tier.color} strokeWidth="9"
            strokeDasharray={`${circ*pct} ${circ*(1-pct)}`}
            strokeDashoffset={circ*0.25} strokeLinecap="round"/>
          {/* score */}
          <text x="48" y="43" textAnchor="middle"
            style={{fontFamily:"Nunito,sans-serif",fontSize:18,fontWeight:900,fill:tier.color}}>{score}</text>
          <text x="48" y="58" textAnchor="middle"
            style={{fontFamily:"Mitr,sans-serif",fontSize:8,fill:"#b07d89"}}>/ 1,000</text>
        </svg>
      </div>
      <div style={{background:tier.bg,border:`1.5px solid ${tier.color}40`,borderRadius:20,
          padding:"3px 12px",fontSize:11,fontWeight:700,color:tier.color}}>
        {tier.label}
      </div>
    </div>
  );
}
function IncomeChart({monthly}){
  if(!monthly.length)return <div style={{textAlign:"center",color:"#b07d89",fontSize:12,padding:16}}>ยังไม่มีข้อมูล</div>;
  const data=monthly.slice(0,6).reverse();
  const max=Math.max(...data.map(m=>m.income+m.sRev),1);
  return(
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:90,padding:"0 4px"}}>
      {data.map(m=>{
        const total=m.income+m.sRev;
        const h1=Math.round((total/max)*78);
        const h2=Math.round(((m.usP||0)/max)*78);
        const h3=Math.round(((m.momP||0)/max)*78);
        return(
          <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <div style={{fontSize:8,color:"#b07d89",fontFamily:"Nunito,sans-serif",fontWeight:700}}>
              {h1>0?`฿${Math.round(total/1000)}k`:""}
            </div>
            <div style={{display:"flex",alignItems:"flex-end",gap:1,height:72}}>
              <div style={{width:8,height:Math.max(2,h1),background:"linear-gradient(to top,#ff9eaa,#ffcdb2)",borderRadius:"3px 3px 0 0"}}/>
              <div style={{width:8,height:Math.max(2,h2),background:"linear-gradient(to top,#10b981,#86efac)",borderRadius:"3px 3px 0 0"}}/>
              <div style={{width:8,height:Math.max(2,h3),background:"linear-gradient(to top,#a855f7,#d8b4fe)",borderRadius:"3px 3px 0 0"}}/>
            </div>
            <div style={{fontSize:8,color:"#b07d89",textAlign:"center",lineHeight:1.2}}>{m.label.replace(" ","\n")}</div>
          </div>
        );
      })}
    </div>
  );
}
function KPI({icon,label,value,color,sub}){
  return <div className="card" style={{padding:"10px 8px",textAlign:"center"}}>
    <div style={{fontSize:16,marginBottom:2}}>{icon}</div>

  </div>;
}
function CTag({type}){
  const t=CT.find(x=>x.v===type)||{l:type,c:"#888"};
  return <span className="tag" style={{background:t.c+"20",color:t.c,border:`1px solid ${t.c}40`}}>{t.l}</span>;

function Pill({children,color="#ff9eaa",bg}){
  return <span className="pill" style={{background:bg||color+"20",color,border:`1px solid ${color}40`}}>{children}</span>;
}
function Btn({children,color="#e07a8f",onClick,sm,small,full,outline,disabled}){
  sm=sm||small;
  return <button className={`btn${sm?" btn-sm":""}${full?" btn-full":""}`} onClick={onClick} disabled={disabled}
    style={{background:outline?"transparent":disabled?"#f0e0e4":color,
      color:outline?color:disabled?"#c9a0a8":"#fff",
      border:outline?`2px solid ${color}`:"none",opacity:disabled?.6:1}}>
    {children}
  </button>;
}
function Lbl({children,req}){return <label className="lbl">{children}{req&&<span style={{color:"#ef4444"}}> *</span>}</label>;}
function Row2({label,req,children,hint}){
  return <div className="row">
    <Lbl req={req}>{label}{hint&&<span style={{color:"#b07d89",fontWeight:400,marginLeft:4}}>({hint})</span>}</Lbl>
    {children}
  </div>;
}
// ── ปุ่มติดต่อด่วน: โทร/LINE — ใช้ stopPropagation กันชนกับ onClick ของ card แม่ ──

function MCard({label,value,color="#ff9eaa",sub}){

function BigN({label,value,color,sub}){

function Bar({pct,color="linear-gradient(90deg,#ff9eaa,#ffcdb2)",h=7}){

function Modal({title,onClose,children,wide}){

function CustCard({c,debts,dStats,schedules,allPayments,setModal}){
  const cDebts=debts.filter(d=>d.customerId===c.id);
  const outstanding=cDebts.reduce((a,d)=>a+(dStats[d.id]?.remaining||0),0);
  const totalCredit=cDebts.reduce((a,d)=>a+d.creditPrice,0);
  const totalPaid=cDebts.reduce((a,d)=>a+(dStats[d.id]?.totalPaid||0),0);
  const pct=totalCredit>0?(totalPaid/totalCredit)*100:0;
  const score=calcScore(cDebts,allPayments,schedules);

// ── หน้าต่างรวมข้อมูลลูกค้า: แสดงทุกบัญชีเครดิตของลูกค้าคนเดียวในหน้าต่างเดียว ──
// แก้ปัญหาบิลซ้อนกัน (ลูกค้า 1 คนมีหลายบัญชี) — เปิดเป็น modal ที่ scroll ในตัวเอง
// แทนที่จะขยาย inline ในหน้าลิสต์จนต้องเลื่อนขึ้นลงยาว
function CustOverviewModal({c,debts,dStats,schedules,allPayments,setModal,onClose}){

  const totalPaid=cDebts.reduce((a,d)=>a+(dStats[d.id]?.totalPaid||0),0);
  const overdueAmt=cDebts.reduce((a,d)=>a+(dStats[d.id]?.overdueAmt||0),0);
  const score=calcScore(cDebts,allPayments,schedules);
  const activeDebts=cDebts.filter(d=>(dStats[d.id]?.remaining||0)>0);
  const paidDebts  =cDebts.filter(d=>(dStats[d.id]?.remaining||0)<=0);
  const [expandedId,setExpandedId]=useState(activeDebts[0]?.id||null); // เปิดบัญชีแรกที่ค้างไว้ให้เลย

  const renderDebt=(d,compact=false)=>{

    const od=getOverdue(d,sc2,allPayments,td());
    const isOpen=expandedId===d.id;
    if(compact) return(

    return <div key={d.id} style={{background:"#fffafb",borderRadius:14,marginBottom:8,

      <div onClick={()=>setExpandedId(isOpen?null:d.id)} style={{padding:12,cursor:"pointer"}}>

            </span>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span className="num" style={{fontSize:13,fontWeight:800,color:"#ef4444"}}>

      {isOpen&&<div style={{padding:"0 12px 12px"}}>
        <Bar pct={pct2}/>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#b07d89",marginTop:3,marginBottom:8}}>
          <span>ชำระแล้ว {Math.round(pct2)}%</span>
          <span>฿{fmt(s.totalPaid)} / ฿{fmt(d.creditPrice)} · {d.totalInstallments} งวด</span>
        </div>
        <div className="g4">
          <MCard label="ทุนแม่"  value={`฿${fmt(d.principalMom||0)}`} color="#f97316"/>
          <MCard label="ทุนเรา"  value={`฿${fmt(d.principalUs||0)}`}  color="#ff9eaa"/>
          <MCard label="กำไรแม่" value={`฿${fmt(s.momProfitEarned)}`} color="#a855f7"/>
          <MCard label="กำไรเรา" value={`฿${fmt(s.usProfitEarned)}`}  color="#10b981"/>
        </div>
        {od.length>0&&<div style={{marginTop:8,background:"#fef2f2",borderRadius:9,padding:"6px 10px",fontSize:11,color:"#b91c1c"}}>
          ⚠️ ค้างเกินกำหนด {od.length} งวด รวม ฿{fmt(od.reduce((a,x)=>a+x.amtDue,0))}
        </div>}
        {s.payments.length>0&&<div style={{marginTop:10}}>
          <div style={{fontWeight:700,fontSize:11,color:"#b07d89",marginBottom:4}}>ประวัติการชำระ</div>
          <table className="tbl">
            <thead><tr><th>วันที่</th><th>ยอด</th><th>ประเภท</th><th>หมายเหตุ</th></tr></thead>
            <tbody>
              {s.payments.slice(0,5).map(p=><tr key={p.id}>
                <td>{thD(p.date)}</td>
                <td className="num" style={{fontWeight:700,color:"#10b981"}}>฿{fmt(p.amount)}</td>
                <td>{p.payType==="interest_only"?"ดอก":"ต้น+ดอก"}</td>
                <td style={{color:"#b07d89"}}>{p.note||"—"}</td>
              </tr>)}
            </tbody>
          </table>
          {s.payments.length>5&&<div style={{fontSize:10,color:"#b07d89",marginTop:4,textAlign:"center"}}>
            ...และอีก {s.payments.length-5} รายการ
          </div>}

        <div style={{display:"flex",gap:6,marginTop:10}}>
          <Btn sm color="#10b981" onClick={()=>setModal({type:"addPayment",data:d})}>+ รับเงิน</Btn>
          <Btn sm color="#6366f1" outline onClick={()=>setModal({type:"editDebt",data:d})}>แก้ไข</Btn>
        </div>
      </div>}
    </div>;
  };

  return <Modal title={`👤 ${c.name}`} onClose={onClose} wide>
    {/* ข้อมูลส่วนตัว */}
    <div style={{marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:13,color:"#e07a8f",marginBottom:8}}>📋 ข้อมูลลูกค้า</div>
      <div className="g2">
        {[
          ["ที่อยู่",c.address],["เบอร์",c.phone],
          ["Facebook",c.facebook],["LINE",c.line],
          ["บัตรประชาชน",c.idCard?c.idCard.replace(/(\d{1})(\d{4})(\d{5})(\d{2})(\d{1})/,"$1-$2-$3-$4-$5"):"—"],
          ["หมายเหตุ",c.note],
        ].map(([k,v])=>v?<div key={k} className="info-row" style={{gridColumn:k==="ที่อยู่"?"span 2":"auto"}}>
          <span className="info-label">{k}</span>
          <span className="info-val">{v||"—"}</span>
        </div>:null)}
      </div>
    </div>
    {/* คะแนนเครดิต */}
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,background:"#fff8fb",
        borderRadius:12,padding:10,border:"1px solid #ffdce3"}}>
      <ScoreRing score={score.score} size={64}/>
      <div style={{fontSize:11,color:"#b07d89"}}>
        <div>ตรงเวลา {score.onTime||0} · สาย {score.late||0} · ขาด {score.missed||0}</div>
        <div style={{marginTop:2}}>จากทั้งหมด {score.total||0} งวด</div>

        <MCard label="วงเงินรวม"   value={`฿${fmt(totalCredit)}`} color="#ff9eaa"/>
        <MCard label="ยอดค้างรับ"  value={`฿${fmt(outstanding)}`} color="#ef4444"/>
        <MCard label="ชำระแล้ว"    value={`฿${fmt(totalPaid)}`}   color="#10b981"/>

// ── DebtGroupCard: รวมบัญชีของลูกหนี้คนเดียวกันเป็นการ์ดเดียว ──
// ถ้ามีบัญชีเดียว แสดงแบบเดิม (DebtCard) ไม่เปลี่ยนพฤติกรรม
// ถ้ามีหลายบัญชี รวมเป็นการ์ดเดียวพร้อมสรุปรวม + รายการย่อยกดขยายทีละบัญชี (ซ้อนเป็นชั้นบิล) — ลดพื้นที่การเลื่อนหน้าจอ
function DebtGroupCard({debtsInGroup,c,dStats,schedules,allPayments,setModal,onDelPayment,onDelDebt,ask}){
  if(debtsInGroup.length===1){
    const d=debtsInGroup[0];
    const s=dStats[d.id];
    return <DebtCard d={d} s={s} c={c}
      overdueAmt={s?.overdueAmt||0} overdue={s?.overdue||[]} upcoming={s?.upcoming||[]}
      schedule={schedules[d.id]||[]} allPayments={allPayments}
      setModal={setModal} onDelPayment={onDelPayment} onDelDebt={onDelDebt} ask={ask}/>;
  }
  // ── หลายบัญชี: การ์ดรวม ──
  const [expandedId,setExpandedId]=useState(null);

  // ── ยอดรวม: คำนวณจากตัวเลขจริง (บวก/ลบ) ไม่ใช่หยิบ "remaining" สำเร็จรูปมาบวกกัน ──
  // เดิม: totalRemaining = sum(s.remaining) ซึ่งแต่ละ remaining ผ่าน Math.max(0,...) มาแล้วทีละบัญชี
  // ใหม่: รวมยอดเครดิตทั้งหมด (totalCredit) กับยอดที่จ่ายจริงทั้งหมด (totalPaid) ก่อน
  //       แล้วค่อยลบทีเดียวที่ระดับลูกค้า -> totalRemaining = max(0, totalCredit - totalPaid)
  //       แม่นยำกว่าเพราะสะท้อนสถานะการเงินจริงของลูกค้าคนนั้นโดยตรง ไม่ผ่านการปัดเศษซ้อนหลายชั้น
  const totalCredit=debtsInGroup.reduce((sum,d)=>sum+(d.creditPrice||0),0);
  const totalPaid=debtsInGroup.reduce((sum,d)=>{
    const s=dStats[d.id];
    return sum+(s?.totalPaid||0);
  },0);
  const totalRemaining=Math.max(0,totalCredit-totalPaid);
  const totalOverdue=debtsInGroup.reduce((sum,d)=>sum+(dStats[d.id]?.overdueAmt||0),0);
  const pct=totalCredit>0?Math.min(100,(totalPaid/totalCredit)*100):0;

  // ── ปุ่มทุกตัวใน accordion ต้อง stopPropagation กัน event bubble ไปโดน onClick ของแถวแม่ ──
  // แก้บั๊ก: เดิมกดปุ่ม "แก้ไข/รับเงิน/ลบ" จะไป trigger setExpandedId ของแถวด้วย ทำให้ accordion
  // หุบ/เปิดสลับมั่วพร้อมกับเปิด modal ทำให้ดูเหมือนปุ่มกดไม่ติดหรือทำงานผิดปกติ
  const stop=fn=>e=>{e.stopPropagation();fn();};

  return <div className="card" style={{marginBottom:12,borderLeft:`4px solid ${totalOverdue>0?"#ef4444":"#ffdce3"}`}}>
    <div className="card-p">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div>
          <div style={{fontWeight:800,fontSize:14,color:"#8c5a65"}}>{c?.name||"ไม่ระบุ"}</div>
          <div style={{fontSize:11,color:"#b07d89",marginTop:2}}>{c?.phone}</div>
          <Pill color="#e07a8f">📦 {debtsInGroup.length} บิล</Pill>
        </div>
        <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
          <div className="num" style={{fontSize:14,fontWeight:800,color:totalRemaining>0?"#ef4444":"#10b981"}}>
            {totalRemaining>0?`ค้างรวม ฿${fmt(totalRemaining)}`:"✅ ครบทุกบิล"}
          </div>
          <div style={{fontSize:11,color:"#b07d89"}}>฿{fmt(totalPaid)} / ฿{fmt(totalCredit)}</div>
        </div>
      </div>
      {totalOverdue>0&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,
          padding:"7px 12px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:11,color:"#b91c1c",fontWeight:700}}>⚠️ มีบิลเกินกำหนด</div>
        <span className="num" style={{fontWeight:800,color:"#ef4444"}}>฿{fmt(totalOverdue)}</span>
      </div>}
      <Bar pct={pct}/>

// ── เครื่องคำนวณดอกเบี้ย (แยกอิสระ ไม่บันทึกอะไร ไม่ผูกกับข้อมูลลูกหนี้จริง) ──
function InterestCalcTab(){
  const [principal,setPrincipal]=useState("10000");
  const [rate,setRate]=useState(5);          // % ต่องวด (1-30)
  const [periods,setPeriods]=useState("6");  // จำนวนงวด (ความหมายขึ้นกับ freq)
  const [freq,setFreq]=useState("monthly");  // daily | weekly | monthly
  const [mode,setMode]=useState("flat");     // flat = ดอกคงที่ทุกงวด, reducing = ลดต้นลดดอก

  const FREQ_LABELS={daily:{unit:"วัน",periodWord:"วัน",short:"/วัน"},weekly:{unit:"สัปดาห์",periodWord:"สัปดาห์",short:"/สัปดาห์"},monthly:{unit:"เดือน",periodWord:"งวด",short:"/เดือน"}};
  const fl=FREQ_LABELS[freq];

  const p=+principal||0, m=+periods||0, r=rate/100;

  const flatCalc=useMemo(()=>{
    if(p<=0||m<=0)return null;
    const totalInterest=p*r*m;
    const totalPay=p+totalInterest;
    const perPeriod=totalPay/m;
    return{totalInterest,totalPay,perPeriod,perPeriodInterest:p*r};
  },[p,r,m]);

  const reducingCalc=useMemo(()=>{
    if(p<=0||m<=0)return null;
    const principalPerPeriod=p/m;
    let balance=p,totalInterest=0;
    const rows=[];
    for(let i=1;i<=m;i++){
      const interest=balance*r;
      const pay=principalPerPeriod+interest;
      totalInterest+=interest;
      rows.push({period:i,balance,interest,principal:principalPerPeriod,pay});
      balance-=principalPerPeriod;
    }
    return{rows,totalInterest,totalPay:p+totalInterest};
  },[p,r,m]);

  return<div className="in">
    <div style={{fontWeight:800,fontSize:14,color:"#8c5a65",marginBottom:4}}>🧮 เครื่องคำนวณดอกเบี้ย</div>
    <div style={{fontSize:11,color:"#b07d89",marginBottom:12}}>
      เครื่องมือคำนวณเฉยๆ ไม่บันทึกลงระบบ ไม่ผูกกับลูกหนี้จริง — ใช้เพื่อคิดเลขก่อนตกลงเงื่อนไขกับลูกค้า
    </div>

    {/* ── เลือกความถี่งวด: รายวัน / รายสัปดาห์ / รายเดือน ── */}
    <div className="row"><Lbl>ความถี่การผ่อนชำระ</Lbl>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        {[["daily","รายวัน","#10b981"],["weekly","รายสัปดาห์","#6366f1"],["monthly","รายเดือน","#e07a8f"]].map(([fv,label,color])=>(
          <button key={fv} onClick={()=>setFreq(fv)} style={{padding:"9px 4px",borderRadius:10,fontSize:12,fontWeight:700,cursor:"pointer",
              border:freq===fv?`2px solid ${color}`:"2px solid #ffdce3",
              background:freq===fv?color+"18":"#fff",color:freq===fv?color:"#b07d89"}}>
            {label}
          </button>
        ))}
      </div>
    </div>

    <div className="card card-p" style={{marginBottom:12}}>
      <div className="row"><Lbl>เงินต้น (฿)</Lbl>
        <input type="number" className="inp num" value={principal} onChange={e=>setPrincipal(e.target.value)} placeholder="10000"/>
      </div>
      <div className="row"><Lbl>จำนวนงวด ({fl.periodWord})</Lbl>
        <input type="number" className="inp num" value={periods} onChange={e=>setPeriods(e.target.value)} placeholder="6"/>
      </div>
      <div className="row"><Lbl>อัตราดอกเบี้ยต่อ{fl.unit}: {rate}%</Lbl>
        <input type="range" min="1" max="30" step="1" value={rate}
          onChange={e=>setRate(+e.target.value)} style={{width:"100%",accentColor:"#e07a8f"}}/>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#b07d89",marginTop:2}}>
          <span>1%</span><span>15%</span><span>30%</span>
        </div>
      </div>
      <div style={{display:"flex",gap:6,marginTop:8}}>
        <input type="number" min="1" max="30" className="inp num" style={{width:70}} value={rate}
          onChange={e=>setRate(Math.min(30,Math.max(1,+e.target.value||1)))}/>
        <div style={{display:"flex",gap:4,flex:1}}>
          {[1,3,5,10,15,20,30].map(v=>(
            <button key={v} onClick={()=>setRate(v)} style={{flex:1,padding:"6px 2px",fontSize:10,
                borderRadius:7,border:rate===v?"2px solid #e07a8f":"1px solid #ffdce3",
                background:rate===v?"#fff0f3":"#fff",color:rate===v?"#e07a8f":"#b07d89",
                fontWeight:700,cursor:"pointer"}}>{v}%</button>
          ))}
        </div>
      </div>
    </div>

    <div className="row"><Lbl>รูปแบบดอกเบี้ย</Lbl>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        <button onClick={()=>setMode("flat")} style={{padding:"10px 6px",borderRadius:10,fontSize:12,fontWeight:700,cursor:"pointer",
            border:mode==="flat"?"2px solid #f97316":"2px solid #ffdce3",
            background:mode==="flat"?"#fff7ed":"#fff",color:mode==="flat"?"#c2410c":"#b07d89"}}>
          ดอกคงที่ (Flat Rate)
        </button>
        <button onClick={()=>setMode("reducing")} style={{padding:"10px 6px",borderRadius:10,fontSize:12,fontWeight:700,cursor:"pointer",
            border:mode==="reducing"?"2px solid #10b981":"2px solid #ffdce3",
            background:mode==="reducing"?"#f0fdf4":"#fff",color:mode==="reducing"?"#166534":"#b07d89"}}>
          ลดต้นลดดอก (Reducing)
        </button>
      </div>
    </div>

    {mode==="flat"&&flatCalc&&<>
      <div className="g2" style={{marginBottom:10}}>
        <MCard label="ดอกเบี้ยรวมทั้งหมด" value={`฿${fmt(flatCalc.totalInterest)}`} color="#f97316"/>
        <MCard label="ยอดรวมที่ต้องจ่าย" value={`฿${fmt(flatCalc.totalPay)}`} color="#8c5a65"/>
        <MCard label={`ผ่อนต่อ${fl.unit}`} value={`฿${fmt(flatCalc.perPeriod)}`} color="#e07a8f"/>

      </div>
    </>}
  </div>;
}

function App({onLock,userEmail}){
  const [customers,setCustomers]=useState(()=>load("customers",[]));
  const [debts,setDebts]=useState(()=>load("debts",[]));

  const [cashTxns,setCashTxns]=useState(()=>load("cashTxns",[]));
  const [bills,setBills]=useState(()=>load("bills",[]));
  const [printBill,setPrintBill]=useState(null);
  const [tab,setTab]=useState("dashboard");
  const [modal,setModal]=useState(null);
  const [search,setSearch]=useState("");
  const [globalSearch,setGlobalSearch]=useState("");
  const [showGlobalSearch,setShowGlobalSearch]=useState(false);
  const globalResults=useMemo(()=>{
    const q=globalSearch.trim().toLowerCase();
    if(!q)return{customers:[],bills:[],payments:[]};

      c.name.toLowerCase().includes(q)||(c.phone||"").includes(q)||

      const cu=customers.find(c=>c.id===b.customerId);

    });
    const payMatches=payments.filter(p=>{
      const d=debts.find(x=>x.id===p.debtId);
      const cu=d?customers.find(c=>c.id===d.customerId):null;
      return (cu?.name||"").toLowerCase().includes(q)||(p.note||"").toLowerCase().includes(q);
    }).slice(0,20);
    return{customers:custMatches,bills:billMatches,payments:payMatches};
  },[globalSearch,customers,bills,payments,debts]);
  const [debtFilter,setDebtFilter]=useState("active"); // active | paid | all
  const [alertDate,setAlertDate]=useState(td());
  const [theme,setTheme]=useState(()=>load("theme","light"));
  useEffect(()=>{document.body.dataset.theme=theme;save("theme",theme);},[theme]);
  const [accent,setAccent]=useState(()=>load("accent","pink"));
  useEffect(()=>{document.body.dataset.accent=accent;save("accent",accent);},[accent]);
  const [preset,setPreset]=useState(()=>load("preset","pink"));
  useEffect(()=>{document.body.dataset.preset=preset;save("preset",preset);},[preset]);
  const [showAccentPicker,setShowAccentPicker]=useState(false);
  const closeModal=()=>setModal(null);
  // ── custom confirm modal: แทนที่ window.confirm() ซึ่งถูกบล็อกในบาง webview/มือถือ
  //    ทำให้กดปุ่มลบ/รับชำระแล้วดูเหมือนไม่มีอะไรเกิดขึ้น (dialog ไม่โผล่ ค่าเงียบเป็น false) ──
  const [askConfirm,setAskConfirm]=useState(null); // {msg, onYes}
  const ask=(msg,onYes)=>setAskConfirm({msg,onYes});
  // ── undo toast: เผื่อมือลั่นกดลบผิด — แสดงปุ่ม "เลิกทำ" 5 วิหลังลบ ──
  const [undoToast,setUndoToast]=useState(null); // {msg, onUndo}
  const undoTimerRef=React.useRef(null);
  function showUndo(msg,onUndo){
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
    setUndoToast({msg,onUndo});
    undoTimerRef.current=setTimeout(()=>setUndoToast(null),5000);
  }
  function doUndo(){
    if(undoToast?.onUndo)undoToast.onUndo();
    setUndoToast(null);
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
  }
  useEffect(()=>{save("customers",customers)},[customers]);
  useEffect(()=>{save("debts",debts)},[debts]);
  useEffect(()=>{save("payments",payments)},[payments]);
  useEffect(()=>{save("sales",sales)},[sales]);
  useEffect(()=>{save("cashTxns",cashTxns)},[cashTxns]);
  useEffect(()=>{save("bills",bills)},[bills]);
  const custMap=useMemo(()=>Object.fromEntries(customers.map(c=>[c.id,c])),[customers]);
  const debtMap=useMemo(()=>Object.fromEntries(debts.map(d=>[d.id,d])),[debts]);
  const schedules=useMemo(()=>{
    const m={};debts.forEach(d=>{m[d.id]=buildSchedule(d,payments);});return m;
  },[debts,payments]);
  const dStats=useMemo(()=>{
    const now=td();
    const s={};
    debts.forEach(d=>{
      const sp=calcSplit(d);
      const ps=payments.filter(p=>p.debtId===d.id);
      const paid=ps.reduce((a,p)=>a+p.amount,0);
      const remaining=Math.max(0,d.creditPrice-paid);
      const sc=schedules[d.id]||[];
      const od=getOverdue(d,sc,payments,now);
      const upcoming=sc.filter(x=>x.date>now&&x.date<=addD(now,7));
      s[d.id]={...sp,totalPaid:paid,remaining,
        momCapReturned:paid*sp.momRatio,usCapReturned:paid*sp.usRatio,
        momProfitEarned:paid*sp.momProfitRatio,usProfitEarned:paid*sp.usProfitRatio,
        installAmt:+(d.creditPrice/(d.totalInstallments||1)).toFixed(2),
        payments:ps,overdue:od,overdueAmt:od.reduce((a,x)=>a+x.amtDue,0),upcoming};
    });return s;
  },[debts,payments,schedules]);
  const totals=useMemo(()=>{
    let momCap=0,usCap=0,momP=0,usP=0,outstanding=0,overdueTotal=0;
    debts.forEach(d=>{momCap+=d.principalMom||0;usCap+=d.principalUs||0;outstanding+=dStats[d.id]?.remaining||0;overdueTotal+=dStats[d.id]?.overdueAmt||0;});
    Object.values(dStats).forEach(s=>{momP+=s.momProfitEarned;usP+=s.usProfitEarned;});
    const sRev=sales.reduce((a,s)=>a+s.revenue,0),sCost=sales.reduce((a,s)=>a+s.cost,0);
    return{momCap,usCap,momP,usP,outstanding,overdueTotal,sRev,sCost,sProfit:sRev-sCost};
  },[debts,dStats,sales]);
  const monthly=useMemo(()=>{
    const map={};
    payments.forEach(p=>{
      const d=debtMap[p.debtId];if(!d)return;
      const sp=calcSplit(d);const k=mKey(p.date);
      if(!map[k])map[k]={income:0,momCap:0,usCap:0,momP:0,usP:0,sRev:0,sProfit:0,cnt:0};
      map[k].income+=p.amount;map[k].momCap+=p.amount*sp.momRatio;map[k].usCap+=p.amount*sp.usRatio;
      map[k].momP+=p.amount*sp.momProfitRatio;map[k].usP+=p.amount*sp.usProfitRatio;map[k].cnt++;
    });
    sales.forEach(s=>{
      const k=mKey(s.date);if(!map[k])map[k]={income:0,momCap:0,usCap:0,momP:0,usP:0,sRev:0,sProfit:0,cnt:0};
      map[k].sRev+=s.revenue;map[k].sProfit+=s.revenue-s.cost;
    });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>({key:k,label:mLbl(k),...v}));
  },[payments,sales,debtMap]);
  const scoreData=useMemo(()=>calcScore(debts,payments,schedules),[debts,payments,schedules]);
  const nearDue=useMemo(()=>{
    const horizon=addD(td(),7);
    return debts.filter(d=>{
      if((dStats[d.id]?.remaining||0)<=0)return false;
      return(schedules[d.id]||[]).some(s=>s.date>td()&&s.date<=horizon);
    });
  },[debts,dStats,schedules]);
  const riskList=useMemo(()=>{
    const now=td(),list=[];
    debts.forEach(d=>{
      if((dStats[d.id]?.remaining||0)<=0)return;
      const od=getOverdue(d,schedules[d.id]||[],payments,now);
      if(!od.length)return;
      const overdueAmt=od.reduce((a,x)=>a+x.amtDue,0);
      const daysLate=Math.round((new Date(now)-new Date(od[0].date))/(86400000));
      list.push({debt:d,cust:custMap[d.customerId],overdueCount:od.length,overdueAmt,daysLate});
    });
    return list.sort((a,b)=>b.overdueAmt-a.overdueAmt).slice(0,5);
  },[debts,schedules,payments,dStats,custMap]);
  const collectionRate=useMemo(()=>{
    if(!monthly.length)return null;
    const m=monthly[0];const[y,mo]=m.key.split("-");
    const ms=`${m.key}-01`,me=addM(ms,1);
    let exp=0;
    debts.forEach(d=>{(schedules[d.id]||[]).forEach(s=>{if(s.date>=ms&&s.date<me)exp+=s.amtDue;});});
    const rate=exp>0?Math.min(100,(m.income/exp)*100):null;
    return{label:m.label,expected:exp,collected:m.income,rate};
  },[monthly,debts,schedules]);
  const alertItems=useMemo(()=>{
    const res=[];
    debts.forEach(d=>{
      if((dStats[d.id]?.remaining||0)<=0)return;
      const sc=schedules[d.id]||[];
      const due=sc.filter(s=>s.date===alertDate);
      const od=getOverdue(d,sc,payments,alertDate);
      if(due.length>0||od.length>0){
        res.push({debt:d,cust:custMap[d.customerId],due,overdue:od,
          dueAmt:due.reduce((a,x)=>a+x.amtDue,0),overdueAmt:od.reduce((a,x)=>a+x.amtDue,0)});
      }
    });
    return res.sort((a,b)=>b.overdueAmt-a.overdueAmt);
  },[debts,schedules,payments,alertDate,custMap,dStats]);

  // ── งานวันนี้: รวมทุกอย่างที่ต้องทำ + checklist "ติดต่อแล้ว" (เก็บแยกตามวัน กันข้อมูลค้างข้ามวัน) ──
  const [contactedToday,setContactedToday]=useState(()=>load("contacted_"+td(),{}));
  useEffect(()=>{save("contacted_"+td(),contactedToday)},[contactedToday]);
  const toggleContacted=(debtId)=>setContactedToday(x=>({...x,[debtId]:!x[debtId]}));
  const todayTasks=useMemo(()=>{
    const todayStr=td();
    const dueToday=[];
    debts.forEach(d=>{
      if((dStats[d.id]?.remaining||0)<=0)return;
      const sc=schedules[d.id]||[];
      const due=sc.filter(s=>s.date===todayStr);
      const od=getOverdue(d,sc,payments,todayStr);
      if(due.length>0||od.length>0){
        dueToday.push({debt:d,cust:custMap[d.customerId],
          amt:due.reduce((a,x)=>a+x.amtDue,0)+od.reduce((a,x)=>a+x.amtDue,0),
          overdue:od.length>0});
      }
    });
    dueToday.sort((a,b)=>b.overdue-a.overdue);
    const unbilled=customers.filter(c=>{
      const cDebts=debts.filter(d=>d.customerId===c.id&&(dStats[d.id]?.remaining||0)>0);
      if(!cDebts.length)return false;
      const hasBill=bills.some(b=>b.customerId===c.id&&b.status==="pending");
      return !hasBill;
    });
    const doneCount=dueToday.filter(x=>contactedToday[x.debt.id]).length;
    return{dueToday,unbilled,doneCount,totalCount:dueToday.length};
  },[debts,schedules,payments,custMap,dStats,customers,bills,contactedToday]);

  // ── สรุปก่อนนอน: วันนี้เก็บได้เท่าไหร่ จากใคร, ยังไม่ได้จากใคร, พรุ่งนี้มีนัดกี่ราย ──
  const eodSummary=useMemo(()=>{
    const todayStr=td();
    const tomorrowStr=addD(todayStr,1);
    const todayPayments=payments.filter(p=>p.date===todayStr);
    // ── รวมยอดรับชำระรายลูกค้า (ลูกค้า 1 คนจ่ายหลายบิลในวันเดียว รวมเป็นบรรทัดเดียว) ──
    const byCust={};
    todayPayments.forEach(p=>{
      const d=debts.find(x=>x.id===p.debtId);
      const key=d?.customerId||"unknown";
      if(!byCust[key])byCust[key]={name:custMap[key]?.name||"ไม่ระบุ",amount:0,count:0};
      byCust[key].amount+=p.amount;
      byCust[key].count+=1;
    });
    const paymentRows=Object.values(byCust);
    // ── ขายสด: นับเป็นเงินที่เก็บได้จริง = ยอดขาย (revenue) ไม่ใช่กำไร ──
    const todaySales=sales.filter(s=>s.date===todayStr);
    const salesRevenue=todaySales.reduce((a,s)=>a+(+s.revenue||0),0);
    const salesProfitToday=todaySales.reduce((a,s)=>a+((+s.revenue||0)-(+s.cost||0)),0);
    // รายการทั้งหมดที่นำมาบวก — ยอดรวมคำนวณจากบรรทัดเหล่านี้โดยตรง จึงตรงกับที่แสดงเสมอ
    const collectedRows=[
      ...paymentRows.map(r=>({label:r.name,sub:r.count>1?`${r.count} รายการ`:"",amount:r.amount,kind:"pay"})),
      ...(salesRevenue>0?[{label:"ขายสด",sub:`${todaySales.length} รอบ`,amount:salesRevenue,kind:"sale"}]:[]),
    ];
    const collectedTotal=collectedRows.reduce((a,r)=>a+r.amount,0);
    const collectedToday=todayPayments.reduce((a,p)=>a+p.amount,0);
    const collectedFrom=paymentRows;
    const notPaidToday=todayTasks.dueToday.filter(x=>!x.overdue&&!payments.some(p=>p.debtId===x.debt.id&&p.date===todayStr));
    const tomorrowCount=debts.filter(d=>{
      if((dStats[d.id]?.remaining||0)<=0)return false;
      return(schedules[d.id]||[]).some(s=>s.date===tomorrowStr);
    }).length;
    return{collectedToday,collectedFrom,collectedRows,collectedTotal,salesRevenue,salesProfitToday,
      salesToday:salesProfitToday,notPaidToday,tomorrowCount};
  },[payments,todayTasks,debts,dStats,schedules,custMap,sales]);
  const byType=useMemo(()=>{
    const m={};CT.forEach(ct=>{m[ct.v]={count:0,total:0,outstanding:0,momCap:0,usCap:0,momP:0,usP:0}});
    debts.forEach(d=>{const t=m[d.creditType];if(!t)return;const s=dStats[d.id];
      t.count++;t.total+=d.creditPrice;t.outstanding+=s.remaining;
      t.momCap+=d.principalMom||0;t.usCap+=d.principalUs||0;t.momP+=s.momProfitEarned;t.usP+=s.usProfitEarned;});
    return m;
  },[debts,dStats]);
  const cashFlow=useMemo(()=>{
    let cashIn=0,cashOut=0;const events=[];
    payments.forEach(p=>{const d=debtMap[p.debtId];if(!d)return;const sp=calcSplit(d);
      const our=p.amount*(sp.usRatio+sp.usProfitRatio);cashIn+=our;
      events.push({date:p.date,type:"รับชำระ(ส่วนเรา)",amount:our,dir:"in",ref:p.id});});
    debts.forEach(d=>{const us=d.principalUs||0;if(us>0){cashOut+=us;
      events.push({date:d.startDate||td(),type:"ปล่อยทุนเรา",amount:us,dir:"out",ref:d.id});}});
    sales.forEach(s=>{cashIn+=s.revenue;cashOut+=s.cost;
      events.push({date:s.date,type:"รายได้ขายสด",amount:s.revenue,dir:"in",ref:s.id});
      if(s.cost>0)events.push({date:s.date,type:"ต้นทุนขายสด",amount:s.cost,dir:"out",ref:s.id});});
    let start=0;
    cashTxns.forEach(t=>{if(t.kind==="start"){start=t.amount;return;}
      if(t.kind==="deposit"){cashIn+=t.amount;events.push({date:t.date,type:"ฝากเงิน",amount:t.amount,dir:"in",ref:t.id,note:t.note});}
      if(t.kind==="withdraw"){cashOut+=t.amount;events.push({date:t.date,type:"ถอนเงิน",amount:t.amount,dir:"out",ref:t.id,note:t.note});}});
    return{startBalance:start,cashIn,cashOut,balance:start+cashIn-cashOut,events:events.sort((a,b)=>b.date.localeCompare(a.date))};
  },[payments,debts,sales,cashTxns,debtMap]);
  const filtC=useMemo(()=>{const q=search.toLowerCase();
    return customers.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||"").includes(q)||(c.idCard||"").includes(q));
  },[customers,search]);
  const agingReport=useMemo(()=>{
    const now=td();
    const buckets=[
      {k:"current", label:"ปกติ (ไม่ค้าง)",      color:"#10b981", days:[0,0]},
      {k:"d30",     label:"ค้าง 1–30 วัน",        color:"#f59e0b", days:[1,30]},
      {k:"d60",     label:"ค้าง 31–60 วัน",       color:"#f97316", days:[31,60]},
      {k:"d90",     label:"ค้าง 61–90 วัน",       color:"#ef4444", days:[61,90]},
      {k:"npl",     label:"NPL 90+ วัน (หนี้เสีย)",color:"#7f1d1d", days:[91,9999]},
    ];
    const result=buckets.map(b=>({...b,count:0,outstanding:0,debtors:[]}));
    debts.forEach(d=>{
      const s=dStats[d.id];if(!s||s.remaining<=0)return;
      const od=s.overdue||[];
      const daysLate=od.length>0
        ? Math.round((new Date(now)-new Date(od[0].date))/86400000)
        : 0;
      const bucket=result.find(b=>daysLate>=b.days[0]&&daysLate<=b.days[1])||result[result.length-1];
      bucket.count++;
      bucket.outstanding+=s.remaining;
      bucket.debtors.push({name:custMap[d.customerId]?.name||"ไม่ระบุ",remaining:s.remaining,daysLate,phone:custMap[d.customerId]?.phone||""});
    });
    return result;
  },[debts,dStats,custMap]);
  const nplRate=useMemo(()=>{
    const npl=agingReport.find(b=>b.k==="npl");
    const totalOutstanding=agingReport.reduce((a,b)=>a+b.outstanding,0);
    return{
      nplCount:npl?.count||0,
      nplAmt:npl?.outstanding||0,
      rate:totalOutstanding>0?((npl?.outstanding||0)/totalOutstanding)*100:0,
      totalOutstanding,
    };
  },[agingReport]);
  const pnl=useMemo(()=>{
    return monthly.map(m=>{
      const interestIncome=m.momP+m.usP;         // รายได้ดอกเบี้ย
      const salesGross=m.sRev;                    // รายได้ขายสด
      const salesCost=m.sRev-m.sProfit;           // ต้นทุนขายสด
      const grossProfit=interestIncome+m.sProfit; // กำไรขั้นต้น
      const provision=interestIncome*0.05;
      const netProfit=grossProfit-provision;
      const revenue=m.income+m.sRev;              // รายได้รวมทั้งหมด
      const cogf=m.momCap;                        // ต้นทุนเงินทุนแม่ (Cost of Funds)
      const momShare=m.momP;                      // ส่วนแบ่งกำไรแม่
      const netOps=grossProfit;                   // กำไรจากการดำเนินงานสุทธิ
      const grossMargin=revenue>0?(grossProfit/revenue)*100:0;
      // แก้บั๊ก: เดิม pnl ไม่มี revenue/cogf/momShare/netOps/grossMargin เลย

      return{...m,interestIncome,salesGross,salesCost,grossProfit,provision,netProfit,

  const filtD=useMemo(()=>{

  // ── รับชำระบิล: สร้าง payment record จริงสำหรับทุก item ที่ผูกกับบัญชีหนี้ ──
  // แก้บั๊ก: เดิมกด "รับชำระ" แค่เปลี่ยน status ของบิล แต่ไม่มีการบันทึกเงินเข้าระบบ payments

  const [lastBackup,setLastBackup]=useState(()=>load("lastBackup",null));

  const daysSinceBackup=useMemo(()=>{

  const aging=useMemo(()=>{
    const now=td();
    const buckets=[
      {label:"ปกติ (ยังไม่ครบ)",   key:"current",  min:null, max:0,   color:"#10b981"},
      {label:"ค้าง 1–30 วัน",       key:"d30",      min:1,    max:30,  color:"#f59e0b"},
      {label:"ค้าง 31–60 วัน",      key:"d60",      min:31,   max:60,  color:"#f97316"},
      {label:"ค้าง 61–90 วัน",      key:"d90",      min:61,   max:90,  color:"#ef4444"},
      {label:"ค้างเกิน 90 วัน (NPL)",key:"npl",     min:91,   max:null,color:"#7f1d1d"},
    ];
    const result=buckets.map(b=>({...b,count:0,amount:0,debtors:[]}));
    debts.forEach(d=>{
      const s=dStats[d.id]; if(!s||s.remaining<=0)return;
      const sc=schedules[d.id]||[];
      const od=getOverdue(d,sc,payments,now);
      if(!od.length){
        result[0].count++; result[0].amount+=s.remaining;
        result[0].debtors.push({d,s,cust:custMap[d.customerId]});
        return;
      }
      const oldest=od.reduce((mn,x)=>x.date<mn?x.date:mn,od[0].date);
      const days=Math.round((new Date(now)-new Date(oldest))/(1000*86400));
      const bi=days<=30?1:days<=60?2:days<=90?3:4;
      result[bi].count++; result[bi].amount+=s.remaining;
      result[bi].debtors.push({d,s,cust:custMap[d.customerId],days,overdueAmt:s.overdueAmt});
    });

  const nplData=useMemo(()=>{
    const totalPort=debts.reduce((a,d)=>a+d.creditPrice,0);
    const nplAmt=aging[4]?.amount||0;
    const nplCount=aging[4]?.count||0;
    const rate=totalPort>0?(nplAmt/totalPort)*100:0;
    const provision=(aging[1]?.amount||0)*0.05
      +(aging[2]?.amount||0)*0.20
      +(aging[3]?.amount||0)*0.50
      +(aging[4]?.amount||0)*1.00;
    const netProfit=totals.usP-provision;
    return{totalPort,nplAmt,nplCount,rate,provision,netProfit};

  const pnlDetailed=useMemo(()=>{

  const cfProjection=useMemo(()=>{
    const now=new Date(td());
    const proj=[];
    for(let w=0;w<13;w++){
      const wStart=new Date(now); wStart.setDate(now.getDate()+w*7);
      const wEnd=new Date(wStart); wEnd.setDate(wStart.getDate()+6);
      const ws=wStart.toISOString().slice(0,10);
      const we=wEnd.toISOString().slice(0,10);
      let expected=0;
      debts.forEach(d=>{
        if((dStats[d.id]?.remaining||0)<=0)return;
        (schedules[d.id]||[]).forEach(s=>{
          if(s.date>=ws&&s.date<=we)expected+=s.amtDue;
        });
      });
      proj.push({week:w+1,ws,we,expected,label:"สัปดาห์ "+(w+1)});
    }
    const d30=proj.slice(0,4).reduce((a,x)=>a+x.expected,0);
    const d60=proj.slice(0,9).reduce((a,x)=>a+x.expected,0);
    const d90=proj.slice(0,13).reduce((a,x)=>a+x.expected,0);
    return{weekly:proj,d30,d60,d90};
  },[debts,dStats,schedules]);

  // ── ปฏิทินรวมรายเดือน: state เดือนที่กำลังดู (คำนวณข้อมูลจริงแบบ inline ในหน้า render แทน useMemo) ──

    {k:"cash",i:"💵",l:"เงินสด"},
    {k:"reports",i:"📑",l:"รายงาน"},
    {k:"monthly",i:"📅",l:"รายเดือน"},

    {k:"customers",i:"👤",l:"ลูกค้า"},
    {k:"bills",i:"🧾",l:"วางบิล"},
    {k:"sales",i:"🛒",l:"ขายสด"},
    {k:"summary",i:"📈",l:"สรุป"},
    {k:"analytics",i:"🏦",l:"วิเคราะห์"},
    {k:"calc",i:"🧮",l:"คำนวณ"},
  ];
  return <div style={{minHeight:"100vh",paddingBottom:28}}>

          <div style={{fontSize:11,opacity:.9,marginTop:1}}>แยกทุน–กำไร · ตารางนัด · คะแนนเครดิต</div>
        </div>
        <div style={{display:"flex",gap:5}}>
          <button onClick={()=>setShowGlobalSearch(true)}
              style={{background:"#ffffff30",color:"#fff",border:"1px solid #ffffff50",
              borderRadius:9,padding:"5px 9px",fontSize:11,fontWeight:600,cursor:"pointer"}}>🔍</button>
          <label style={{background:"#ffffff30",color:"#fff",border:"1px solid #ffffff50",
              borderRadius:9,padding:"5px 9px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
            📂<input type="file" accept=".json" onChange={importData} style={{display:"none"}}/>

          <button onClick={exportData} style={{background:"#ffffff30",color:"#fff",border:"1px solid #ffffff50",

          <button onClick={()=>setTheme(t=>t==="light"?"dark":"light")}
