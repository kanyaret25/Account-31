      {tab==="calendar"&&(()=>{
        // คำนวณข้อมูลปฏิทินตรงนี้เลยทุก render (ไม่ใช้ useMemo) — ตัดปัญหา stale cache ทิ้งไปเลย
        // เพราะ calMonth เปลี่ยนทุกครั้งที่กดปุ่ม การคำนวณใหม่ทุกครั้งไม่หนักพอที่จะต้อง memo
        const byDay={};
        debts.forEach(d=>{
          const cu=custMap[d.customerId];
          (schedules[d.id]||[]).forEach(s=>{
            if(!s.date||!s.date.startsWith(calMonth))return;
            if(!byDay[s.date])byDay[s.date]=[];
            const paidOnDay=payments.some(p=>p.debtId===d.id&&p.date===s.date);
            byDay[s.date].push({cust:cu,debt:d,amtDue:s.amtDue,paid:paidOnDay,isPayDay:!!d.payDay,label:s.label});
          });
        });
        const [cy,cm]=calMonth.split("-").map(Number);
        const daysInMonth=new Date(cy,cm,0).getDate();
        const firstDow=new Date(cy,cm-1,1).getDay();
        const totalExpected=Object.values(byDay).flat().reduce((a,x)=>a+x.amtDue,0);
        const totalCount=Object.values(byDay).flat().length;

        const goToMonth=(offset)=>{
          const [yy,mm]=calMonth.split("-").map(Number);
          const nd=new Date(yy,mm-1+offset,1);
          const newMonth=nd.getFullYear()+"-"+String(nd.getMonth()+1).padStart(2,"0");
          setCalMonth(newMonth);
        };

        return<div className="in">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:14,color:"#8c5a65"}}>📅 ปฏิทินนัดชำระรวม</div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <button type="button" onClick={()=>goToMonth(-1)}
                style={{background:"#fff",border:"1px solid #ffdce3",borderRadius:8,width:38,height:38,cursor:"pointer",color:"#e07a8f",fontWeight:800,fontSize:16}}>‹</button>
              <div style={{fontWeight:800,fontSize:13,color:"#8c5a65",minWidth:90,textAlign:"center"}}>
                {MO[cm-1]} {cy+543}
              </div>
              <button type="button" onClick={()=>goToMonth(1)}
                style={{background:"#fff",border:"1px solid #ffdce3",borderRadius:8,width:38,height:38,cursor:"pointer",color:"#e07a8f",fontWeight:800,fontSize:16}}>›</button>
            </div>
          </div>

          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <button type="button" onClick={()=>goToMonth(-1)}
              style={{flex:1,padding:"8px",fontSize:11,borderRadius:8,border:"1px solid #ffdce3",
                background:"#fff",color:"#b07d89",cursor:"pointer",fontWeight:600}}>
              ← เดือนก่อน
            </button>
            <button type="button" onClick={()=>setCalMonth(td().slice(0,7))}
              style={{flex:1,padding:"8px",fontSize:11,borderRadius:8,
                border:calMonth===td().slice(0,7)?"2px solid #e07a8f":"1px solid #ffdce3",
                background:calMonth===td().slice(0,7)?"#fff0f3":"#fff",
                color:calMonth===td().slice(0,7)?"#e07a8f":"#b07d89",cursor:"pointer",fontWeight:700}}>
              🔵 เดือนนี้
            </button>
            <button type="button" onClick={()=>goToMonth(1)}
              style={{flex:1,padding:"8px",fontSize:11,borderRadius:8,border:"1px solid #ffdce3",
                background:"#fff",color:"#b07d89",cursor:"pointer",fontWeight:600}}>
              เดือนหน้า →
            </button>
          </div>

          <div className="g2" style={{marginBottom:10}}>
            <MCard label="ยอดคาดรับรวมทั้งเดือน" value={`฿${fmt(totalExpected)}`} color="#10b981"/>
            <MCard label="จำนวนนัดชำระ" value={`${totalCount} รายการ`} color="#e07a8f"/>
          </div>

          <div className="card card-p" style={{marginBottom:12}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
              {["อา","จ","อ","พ","พฤ","ศ","ส"].map(d=>
                <div key={d} style={{textAlign:"center",fontSize:10,fontWeight:800,color:"#b07d89",padding:"4px 0"}}>{d}</div>
              )}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
              {Array.from({length:firstDow}).map((_,i)=><div key={"pad"+i}/>)}
              {Array.from({length:daysInMonth}).map((_,i)=>{
                const dayNum=i+1;
                const dateStr=`${calMonth}-${String(dayNum).padStart(2,"0")}`;
                const items=byDay[dateStr]||[];
                const total=items.reduce((a,x)=>a+x.amtDue,0);
                const allPaid=items.length>0&&items.every(x=>x.paid);
                const isToday=dateStr===td();
                return <button key={dayNum} type="button" onClick={()=>items.length&&setModal({type:"calDay",data:{dateStr,items}})}
                    style={{aspectRatio:"1",borderRadius:9,border:isToday?"2px solid #e07a8f":"1px solid #ffdce3",
                      background:items.length===0?"#fff":allPaid?"#f0fdf4":"#fff0f3",
                      cursor:items.length?"pointer":"default",padding:2,
                      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                      position:"relative"}}>
                  <div style={{fontSize:10,fontWeight:isToday?900:600,color:isToday?"#e07a8f":"#8c5a65"}}>{dayNum}</div>
                  {items.length>0&&<>
                    <div style={{fontSize:7,color:allPaid?"#10b981":"#ef4444",fontWeight:800,marginTop:1}}>
                      {items.length}
                    </div>
                    <div style={{fontSize:6,color:"#b07d89"}}>฿{Math.round(total/1000)}k</div>
                  </>}
                </button>;
              })}
            </div>
            {totalCount===0&&(
              <div style={{marginTop:10,padding:"10px 12px",background:"#fff0f3",borderRadius:10,
                  fontSize:11,color:"#b07d89",textAlign:"center"}}>
                📭 ไม่มีนัดชำระในเดือน <b>{MO[cm-1]} {cy+543}</b> — ลองเลื่อนดูเดือนอื่นได้
              </div>
            )}
            <div style={{display:"flex",gap:10,marginTop:10,fontSize:9,color:"#b07d89",justifyContent:"center"}}>
              <span><span style={{display:"inline-block",width:8,height:8,background:"#fff0f3",border:"1px solid #ffdce3",borderRadius:2,marginRight:3}}/>มีนัด</span>
              <span><span style={{display:"inline-block",width:8,height:8,background:"#f0fdf4",border:"1px solid #ffdce3",borderRadius:2,marginRight:3}}/>จ่ายครบแล้ว</span>
              <span><span style={{display:"inline-block",width:8,height:8,border:"2px solid #e07a8f",borderRadius:2,marginRight:3}}/>วันนี้</span>
            </div>
          </div>

          {/* ── รายชื่อทั้งเดือน แสดงตรงๆ ไม่ต้องกดเข้าไปทีละวัน ── */}
          <div style={{fontWeight:800,fontSize:13,color:"#8c5a65",marginBottom:8}}>
            📋 รายชื่อนัดชำระทั้งเดือน ({totalCount} รายการ)
          </div>
          {Object.keys(byDay).length===0
            ?<div className="card card-p" style={{textAlign:"center",color:"#b07d89"}}>ไม่มีนัดชำระในเดือนนี้</div>
            :Object.entries(byDay).sort(([a],[b])=>a.localeCompare(b)).map(([dateStr,items])=>{
              const isPast=dateStr<td();
              const isToday=dateStr===td();
              const allPaid=items.every(x=>x.paid);
              return <div key={dateStr} className="card" style={{marginBottom:8,
                  borderLeft:`4px solid ${allPaid?"#10b981":isPast?"#ef4444":isToday?"#e07a8f":"#ffdce3"}`}}>
                <div className="card-p" style={{paddingBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <span style={{fontSize:12,fontWeight:800,color:"#8c5a65"}}>
                      {thD(dateStr)} {isToday&&<span style={{color:"#e07a8f"}}>· วันนี้</span>}
                      {isPast&&!allPaid&&<span style={{color:"#ef4444"}}> · ผ่านมาแล้ว</span>}
                    </span>
                    <span className="num" style={{fontSize:12,fontWeight:800,color:allPaid?"#10b981":"#8c5a65"}}>
                      ฿{fmt(items.reduce((a,x)=>a+x.amtDue,0))}
                    </span>
                  </div>
                  {items.map((it,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                        padding:"4px 0",borderTop:i>0?"1px solid #fff0f3":"none"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:12,color:"#8c5a65",fontWeight:600}}>{it.cust?.name||"ไม่ระบุ"}</span>
                        {it.cust?.phone&&<span style={{fontSize:10,color:"#b07d89"}}>{it.cust.phone}</span>}
                        {it.isPayDay&&<span style={{fontSize:9,color:"#a855f7"}}>· กำหนดเอง</span>}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span className="num" style={{fontSize:11,fontWeight:700,color:it.paid?"#10b981":"#b07d89"}}>
                          ฿{fmt(it.amtDue)}
                        </span>
                        <span style={{fontSize:10}}>{it.paid?"✅":"⏳"}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>;
            })}
        </div>;
      })()}

      {tab==="cash"&&<div className="in">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontWeight:800,fontSize:14,color:"#8c5a65"}}>💵 เงินทุนหมุนเวียน</div>
          <div style={{display:"flex",gap:6}}>
            <Btn sm color="#10b981" onClick={()=>setModal({type:"cashDeposit"})}>+ ฝาก</Btn>
            <Btn sm color="#ef4444" outline onClick={()=>setModal({type:"cashWithdraw"})}>− ถอน</Btn>
          </div>
        </div>
        <div className="hdr" style={{borderRadius:20,padding:18,marginBottom:12,textAlign:"center",boxShadow:"0 2px 16px rgba(255,158,170,.2)"}}>
          <div style={{fontSize:12,opacity:.9}}>ยอดเงินสดคงเหลือตอนนี้</div>
          <div className="num" style={{fontSize:32,fontWeight:900,marginTop:4}}>฿{fmt(cashFlow.balance)}</div>
          <button onClick={()=>setModal({type:"setStartBalance"})} style={{marginTop:10,background:"#ffffff30",
              border:"1px solid #ffffff50",color:"#fff",borderRadius:10,padding:"5px 14px",fontSize:11,cursor:"pointer",fontWeight:600}}>
            ⚙️ ตั้งยอดเริ่มต้น (฿{fmt(cashFlow.startBalance)})
          </button>
        </div>
        <div className="g2" style={{marginBottom:12}}>
          <MCard label="💚 เงินเข้ารวม" value={`฿${fmt(cashFlow.cashIn+cashFlow.startBalance)}`} color="#10b981" sub="รับชำระ+ขายสด+ฝาก"/>
          <MCard label="❤️ เงินออกรวม" value={`฿${fmt(cashFlow.cashOut)}`} color="#ef4444" sub="ปล่อยทุน+ถอน"/>
        </div>
        <div className="card card-p" style={{marginBottom:10,fontSize:11,color:"#b07d89"}}>
          💡 เงินทุนหมุนเวียน = ยอดเริ่มต้น + เงินเข้า(ส่วนของเรา) − เงินออก · ทุนแม่/กำไรแม่ไม่นับรวม
        </div>
        <div style={{fontWeight:800,fontSize:13,color:"#8c5a65",marginBottom:8}}>📜 ประวัติ</div>
        {cashFlow.events.slice(0,50).map((ev,i)=><div key={i} className="card" style={{marginBottom:6}}>
          <div className="card-p" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px"}}>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:"#8c5a65"}}>{ev.type}</div>
              <div style={{fontSize:10,color:"#b07d89"}}>{thD(ev.date)}{ev.note?` · ${ev.note}`:""}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span className="num" style={{fontWeight:800,fontSize:13,color:ev.dir==="in"?"#10b981":"#ef4444"}}>
                {ev.dir==="in"?"+":"−"}฿{fmt(ev.amount)}
              </span>
              {(ev.type==="ฝากเงิน"||ev.type==="ถอนเงิน")&&
                <button onClick={()=>ask("ลบ?",()=>delCashTxn(ev.ref))}
                  style={{background:"#fee2e2",border:"none",borderRadius:7,padding:"2px 7px",fontSize:10,cursor:"pointer",color:"#ef4444"}}>ลบ</button>}
            </div>
          </div>
        </div>)}
      </div>}
      {/* ═══ REPORTS — รายงานการเงิน ═══ */}
      {tab==="reports"&&<div className="in">
        {/* ── NPL KPI strip ── */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:12}}>
          <div className="card card-p" style={{textAlign:"center",borderTop:"3px solid #ef4444"}}>
            <div style={{fontSize:10,color:"#b07d89",marginBottom:3}}>NPL Rate</div>
            <div className="num" style={{fontSize:22,fontWeight:900,
              color:nplRate.rate>10?"#ef4444":nplRate.rate>5?"#f59e0b":"#10b981"}}>
              {nplRate.rate.toFixed(1)}%
            </div>
            <div style={{fontSize:9,color:"#b07d89"}}>หนี้เสียต่อยอดค้างรับ</div>
          </div>
          <div className="card card-p" style={{textAlign:"center",borderTop:"3px solid #f97316"}}>
            <div style={{fontSize:10,color:"#b07d89",marginBottom:3}}>ลูกหนี้ NPL</div>
            <div className="num" style={{fontSize:22,fontWeight:900,color:"#f97316"}}>{nplRate.nplCount} ราย</div>
            <div style={{fontSize:9,color:"#b07d89"}}>ค้างเกิน 90 วัน</div>
          </div>
          <div className="card card-p" style={{textAlign:"center",borderTop:"3px solid #8b5cf6"}}>
            <div style={{fontSize:10,color:"#b07d89",marginBottom:3}}>ยอด NPL</div>
            <div className="num" style={{fontSize:22,fontWeight:900,color:"#8b5cf6"}}>฿{fmt(nplRate.nplAmt)}</div>
            <div style={{fontSize:9,color:"#b07d89"}}>มูลค่าหนี้เสีย</div>
          </div>
        </div>
        {/* ── 1. AGING REPORT ── */}
        <div className="card" style={{marginBottom:12}}>
          <div className="card-p" style={{borderBottom:"1px solid #fff0f3"}}>
            <div style={{fontWeight:800,fontSize:13,color:"#e07a8f"}}>📊 Aging Report — อายุหนี้</div>
            <div style={{fontSize:10,color:"#b07d89",marginTop:2}}>แบ่งลูกหนี้ตามช่วงเวลาค้างชำระ</div>
          </div>
          {agingReport.map((b,i)=>{
            const totalOut=agingReport.reduce((a,x)=>a+x.outstanding,0)||1;
            const pct=(b.outstanding/totalOut)*100;
            return <div key={b.k} className="card-p" style={{borderBottom:i<agingReport.length-1?"1px solid #fff8fb":"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:b.color,flexShrink:0}}/>
                  <span style={{fontSize:12,fontWeight:700,color:"#8c5a65"}}>{b.label}</span>
                </div>
                <div style={{textAlign:"right"}}>
                  <span className="num" style={{fontSize:13,fontWeight:800,color:b.color}}>
                    ฿{fmt(b.outstanding)}
                  </span>
                  <span style={{fontSize:10,color:"#b07d89",marginLeft:6}}>{b.count} ราย</span>
                </div>
              </div>
              <div style={{background:"#f5f5f5",borderRadius:4,height:6,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:b.color,borderRadius:4,transition:"width .4s"}}/>
              </div>
              <div style={{fontSize:9,color:"#b07d89",marginTop:2,textAlign:"right"}}>{pct.toFixed(1)}% ของยอดค้างรวม</div>
              {b.debtors.length>0&&b.k!=="current"&&(
                <div style={{marginTop:6,paddingTop:6,borderTop:"1px dashed #fff0f3"}}>
                  {b.debtors.slice(0,3).map((dtr,j)=>(
                    <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:10,
                        padding:"2px 0",color:"#8c5a65"}}>
                      <span>{dtr.name} {dtr.daysLate>0&&<span style={{color:b.color}}>({dtr.daysLate}วัน)</span>}</span>
                      <span className="num" style={{fontWeight:700}}>฿{fmt(dtr.remaining)}</span>
                    </div>
                  ))}
                  {b.debtors.length>3&&<div style={{fontSize:9,color:"#b07d89"}}>...และอีก {b.debtors.length-3} ราย</div>}
                </div>
              )}
            </div>;
          })}
        </div>
        {/* ── 2. CASH FLOW PROJECTION ── */}
        <div className="card" style={{marginBottom:12}}>
          <div className="card-p" style={{borderBottom:"1px solid #fff0f3"}}>
            <div style={{fontWeight:800,fontSize:13,color:"#e07a8f"}}>💰 Cash Flow Projection — คาดการณ์เงินสด 90 วัน</div>
            <div style={{fontSize:10,color:"#b07d89",marginTop:2}}>
              อิงจากตารางนัดชำระที่ตั้งไว้ (ไม่รวมชำระก่อนกำหนด/ค้างชำระ)
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:0}}>
            {[
              {k:"d30",label:"30 วัน",  val:cfProjection.d30,  color:"#10b981"},
              {k:"d60",label:"31-60 วัน",val:cfProjection.d60-cfProjection.d30, color:"#f59e0b"},
              {k:"d90",label:"61-90 วัน",val:cfProjection.d90-cfProjection.d60, color:"#f97316"},
            ].map((s,i)=>(
              <div key={s.k} className="card-p" style={{
                  borderRight:i<2?"1px solid #fff0f3":"none",textAlign:"center"}}>
                <div style={{fontSize:10,color:"#b07d89",marginBottom:6}}>{s.label}</div>
                <div style={{fontSize:9,color:"#b07d89",marginBottom:2}}>คาดรับ</div>
                <div className="num" style={{fontSize:18,fontWeight:900,color:s.color}}>฿{fmt(s.val)}</div>
              </div>
            ))}
          </div>
          <div style={{padding:"0 14px 12px"}}>
            <div style={{fontSize:10,color:"#b07d89",marginBottom:4}}>ยอดคาดรับรายสัปดาห์ (13 สัปดาห์)</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:3,height:60}}>
              {cfProjection.weekly.map(w=>{
                const maxW=Math.max(...cfProjection.weekly.map(x=>x.expected),1);
                const h=Math.round((w.expected/maxW)*50);
                return <div key={w.week} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  <div style={{width:"100%",height:h,minHeight:2,
                      background:w.week<=4?"linear-gradient(to top,#10b981,#86efac)":
                                 w.week<=9?"linear-gradient(to top,#f59e0b,#fde68a)":
                                 "linear-gradient(to top,#f97316,#fed7aa)",
                      borderRadius:"3px 3px 0 0"}}/>
                </div>;
              })}
            </div>
          </div>
          <div className="card-p" style={{borderTop:"1px solid #fff0f3",background:"#f0fdf4"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:12,fontWeight:700,color:"#166534"}}>รวม 90 วัน (คาดรับตามตารางนัด)</span>
              <span className="num" style={{fontSize:18,fontWeight:900,color:"#15803d"}}>
                ฿{fmt(cfProjection.d90)}
              </span>
            </div>
          </div>
        </div>
        {/* ── 3. P&L งบกำไร-ขาดทุน ── */}
        <div className="card" style={{marginBottom:12}}>
          <div className="card-p" style={{borderBottom:"1px solid #fff0f3"}}>
            <div style={{fontWeight:800,fontSize:13,color:"#e07a8f"}}>📋 P&L — งบกำไร-ขาดทุน รายเดือน</div>
            <div style={{fontSize:10,color:"#b07d89",marginTop:2}}>* ตั้งสำรองหนี้สูญ 5% ของดอกเบี้ยรับ (อนุรักษนิยม)</div>
          </div>
          {pnl.length===0&&<div className="card-p" style={{textAlign:"center",color:"#b07d89",padding:"20px 0"}}>
            ยังไม่มีข้อมูล
          </div>}
          {pnl.slice(0,6).map(m=>(
            <div key={m.key} className="card-p" style={{borderBottom:"1px solid #fff8fb"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontWeight:800,fontSize:13,color:"#8c5a65"}}>{m.label}</span>
                <span className="num" style={{fontSize:15,fontWeight:900,
                    color:m.netProfit>=0?"#10b981":"#ef4444"}}>
                  {m.netProfit>=0?"+":" "}฿{fmt(Math.abs(m.netProfit))}
                </span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 12px",fontSize:11}}>
                {[
                  ["💜 ดอกเบี้ย/กำไรเครดิต", m.interestIncome, "#a855f7"],

function DebtModal({data,presetCustomerId,customers,onSave,onClose}){
  const [f,setF]=useState({
    customerId:data?.customerId||presetCustomerId||"",creditType:data?.creditType||"bad_debt",
    capitalMode:data?.capitalMode||(data&&data.principalMom>0&&data.principalUs>0?"shared":data&&data.principalMom>0?"mom":"us"),
    principalMom:data?.principalMom||"",principalUs:data?.principalUs||"",
    profitEntryMode:"auto", // auto = คำนวณให้อัตโนมัติ, manual = กรอกเอง
    profitSplitPct:data?.profitMom&&data?.profitUs?Math.round((data.profitMom/(data.profitMom+data.profitUs))*100):50, // % ของกำไรที่แม่ได้
    profitMom:data?.profitMom??"",
    profitUs:data?.profitUs??"",
    creditPrice:data?.creditPrice||"",
    totalInstallments:data?.totalInstallments||"",startDate:data?.startDate||td(),
    payDay:data?.payDay||"", // ลูกหนี้กำหนดวันจ่ายเอง (1-31) — ถ้าว่างใช้วันเริ่มต้น
    payFreq:data?.schedule?.freq||"monthly", // ความถี่นัดชำระ: รายวัน/สัปดาห์/เดือน
    interestAmt:data?.interestAmt||"",note:data?.note||""
  });
  const u=k=>e=>setF(x=>({...x,[k]:e.target.value}));
  const pM=+f.principalMom||0,pU=+f.principalUs||0,cp=+f.creditPrice||0;

  // ── คำนวณกำไรอัตโนมัติ: กำไรรวม = ยอดเครดิต - ทุนรวม แล้วแบ่งตาม % ที่เลือก ──
  const totalCap=pM+pU;
  const autoTotalProfit=Math.max(0,cp-totalCap);
  const autoProfitMom=Math.round(autoTotalProfit*(f.profitSplitPct/100));
  const autoProfitUs=autoTotalProfit-autoProfitMom;

  const gM=f.profitEntryMode==="auto"?autoProfitMom:(+f.profitMom||0);
  const gU=f.profitEntryMode==="auto"?autoProfitUs:(+f.profitUs||0);
  const totalProfit=gM+gU;
  const capOk=f.profitEntryMode==="auto"||Math.abs((totalCap+totalProfit)-cp)<1;

  function onModeChange(mode){
    setF(x=>({...x,capitalMode:mode,
      principalMom:mode==="us"?"":x.principalMom,
      principalUs:mode==="mom"?"":x.principalUs}));
  }

  // ── preview ตารางนัดชำระ ── (ประมาณการคร่าวๆ ให้เห็นก่อนบันทึก)
  const schedulePreview=useMemo(()=>{
    if(!(cp>0)||!(+f.totalInstallments>0)||!f.startDate)return[];
    const n=+f.totalInstallments;
    const per=cp/n;
    const rows=[];
    let cur=f.startDate;
    const dayInterval=freqToDays(f.payFreq); // รองรับทั้งตัวเลขวัน (3/5/7/15/30) และ string เดิม (daily/weekly)
    for(let i=0;i<Math.min(n,6);i++){ // โชว์แค่ 6 งวดแรกพอ กันยาวเกิน
      rows.push({no:i+1,date:cur,amt:per});
      if(dayInterval!==null)cur=addD(cur,dayInterval);
      else cur=addM(cur,1); // รายเดือน
    }
    return{rows,per,n};
  },[cp,f.totalInstallments,f.startDate,f.payFreq]);

  const [forceSave,setForceSave]=useState(false);
  function save(){
    const miss=[];
    if(!f.customerId)miss.push("ลูกค้า");
    if(!(cp>0))miss.push("ยอดเครดิตรวม");
    if(!(+f.totalInstallments>0))miss.push("จำนวนงวด");
    if(miss.length){alert("กรุณากรอก: "+miss.join(", "));return;}
    if(!capOk&&!forceSave){
      alert(`⚠️ ทุน+กำไรที่กรอก (฿${fmt(totalCap+totalProfit)}) ไม่เท่ากับยอดเครดิตรวม (฿${fmt(cp)})\n\nกดปุ่ม "บันทึก" อีกครั้งเพื่อยืนยันบันทึกต่อ`);
      setForceSave(true);
      return;
    }
    // คำนวณ momProfitRatio ย้อนกลับเพื่อความเข้ากันได้กับระบบเดิม (calcSplit ใช้ ratio)
    const momProfitRatio=totalProfit>0?gM/totalProfit:0.5;
    // สร้าง schedule เบื้องต้นให้พร้อมใช้ทันที ไม่ต้องเปิด ScheduleModal แยกอีกขั้น
    const autoSchedule={payMode:"principal_interest",freq:f.payFreq,startDate:f.startDate,customDates:[]};
    onSave({...f,principalMom:pM,principalUs:pU,creditPrice:cp,
      profitMom:gM,profitUs:gU,momProfitRatio,
      totalInstallments:+f.totalInstallments,interestAmt:+f.interestAmt||0,
      payDay:f.payDay?+f.payDay:null,
      schedule:data?.schedule||autoSchedule});
  }
  return <Modal title={data?"แก้ไขบัญชีเครดิต":"เพิ่มบัญชีเครดิต"} onClose={onClose} wide>
    <div className="row"><Lbl req>ลูกค้า</Lbl>
      <select className="inp" value={f.customerId} onChange={u("customerId")}>
        <option value="">-- เลือกลูกค้า --</option>
        {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
    </div>
    <div className="row"><Lbl req>ประเภทเครดิต</Lbl>
      <select className="inp" value={f.creditType} onChange={u("creditType")}>
        {CT.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
      </select>
    </div>

    {/* ── เลือกแหล่งทุน ── */}
    <div className="row"><Lbl>แหล่งทุน</Lbl>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        {[["mom","ทุนแม่ล้วน","#f97316"],["us","ทุนเราล้วน","#ff9eaa"],["shared","ทุนร่วม","#a855f7"]].map(([mode,label,color])=>(
          <button key={mode} onClick={()=>onModeChange(mode)} style={{
              padding:"9px 6px",borderRadius:10,fontSize:12,fontWeight:700,cursor:"pointer",
              border:f.capitalMode===mode?`2px solid ${color}`:"2px solid #ffdce3",
              background:f.capitalMode===mode?color+"18":"#fff",
              color:f.capitalMode===mode?color:"#b07d89"}}>
            {label}
          </button>
        ))}
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
      <div className="row"><Lbl>ทุนแม่ (฿)</Lbl>
        <input type="number" className="inp num" value={f.principalMom} placeholder="0"
          disabled={f.capitalMode==="us"} style={f.capitalMode==="us"?{opacity:.4}:{}}
          onChange={u("principalMom")}/></div>
      <div className="row"><Lbl>ทุนเรา (฿)</Lbl>
        <input type="number" className="inp num" value={f.principalUs} placeholder="0"
          disabled={f.capitalMode==="mom"} style={f.capitalMode==="mom"?{opacity:.4}:{}}
          onChange={u("principalUs")}/></div>
    </div>

    <div className="row"><Lbl req>ยอดเครดิตรวม (ที่ลูกค้าต้องจ่ายทั้งหมด)</Lbl>
      <input type="number" className="inp num" value={f.creditPrice} placeholder="เช่น 6500" onChange={u("creditPrice")}/>
    </div>

    {/* ── กำไร: เลือกโหมดคำนวณอัตโนมัติ หรือกรอกเอง ── */}
    <div className="row"><Lbl>วิธีคิดกำไร</Lbl>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        <button onClick={()=>setF(x=>({...x,profitEntryMode:"auto"}))} style={{
            padding:"9px 6px",borderRadius:10,fontSize:12,fontWeight:700,cursor:"pointer",
            border:f.profitEntryMode==="auto"?"2px solid #10b981":"2px solid #ffdce3",
            background:f.profitEntryMode==="auto"?"#f0fdf4":"#fff",
            color:f.profitEntryMode==="auto"?"#166534":"#b07d89"}}>
          🤖 คำนวณให้อัตโนมัติ
        </button>
        <button onClick={()=>setF(x=>({...x,profitEntryMode:"manual",profitMom:autoProfitMom,profitUs:autoProfitUs}))} style={{
            padding:"9px 6px",borderRadius:10,fontSize:12,fontWeight:700,cursor:"pointer",
            border:f.profitEntryMode==="manual"?"2px solid #6366f1":"2px solid #ffdce3",
            background:f.profitEntryMode==="manual"?"#eef2ff":"#fff",
            color:f.profitEntryMode==="manual"?"#4338ca":"#b07d89"}}>
          ✏️ กรอกเอง
        </button>
      </div>
    </div>

    {f.profitEntryMode==="auto"?(
      <div className="row">
        <Lbl>สัดส่วนกำไร → แม่ {f.profitSplitPct}% : เรา {100-f.profitSplitPct}%</Lbl>
        <input type="range" min="0" max="100" step="5" value={f.profitSplitPct}
          onChange={e=>setF(x=>({...x,profitSplitPct:+e.target.value}))}
          style={{width:"100%",accentColor:"#e07a8f"}}/>
      </div>
    ):(
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
        <div className="row"><Lbl>กำไรแม่ (฿)</Lbl>
          <input type="number" className="inp num" value={f.profitMom} placeholder="0" onChange={u("profitMom")}/></div>
        <div className="row"><Lbl>กำไรเรา (฿)</Lbl>
          <input type="number" className="inp num" value={f.profitUs} placeholder="0" onChange={u("profitUs")}/></div>
      </div>
    )}

    {cp>0&&<div className="g4" style={{marginBottom:8}}>
      <MCard label="ทุนรวม"  value={`฿${fmt(totalCap)}`}    color="#b07d89"/>
      <MCard label="กำไรรวม" value={`฿${fmt(totalProfit)}`} color="#f59e0b"/>
      <MCard label="รวมทั้งสิ้น" value={`฿${fmt(totalCap+totalProfit)}`} color={capOk?"#10b981":"#ef4444"}/>
      <MCard label="ยอดเครดิต" value={`฿${fmt(cp)}`} color="#8c5a65"/>
    </div>}
    {cp>0&&f.profitEntryMode==="manual"&&!capOk&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:9,
        padding:"8px 12px",marginBottom:10,fontSize:11,color:"#b91c1c"}}>
      ⚠️ ทุน+กำไรที่กรอก (฿{fmt(totalCap+totalProfit)}) ไม่เท่ากับยอดเครดิตรวม (฿{fmt(cp)}) — ตรวจสอบตัวเลขอีกครั้ง
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
      <div className="row"><Lbl req>จำนวนงวด</Lbl><input type="number" className="inp num" value={f.totalInstallments} placeholder="10" onChange={u("totalInstallments")}/></div>
      <div className="row"><Lbl>ค่าดอกต่องวด (กรณีจ่ายแต่ดอก)</Lbl><input type="number" className="inp num" value={f.interestAmt} placeholder="0" onChange={u("interestAmt")}/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
      <div className="row"><Lbl>วันเริ่มต้น</Lbl><input type="date" className="inp" value={f.startDate} onChange={u("startDate")}/></div>
      <div className="row"><Lbl>ความถี่นัดชำระ</Lbl>
        <select className="inp" value={f.payFreq} onChange={u("payFreq")}>
          <option value="daily">รายวัน (ทุก 1 วัน)</option>
          <option value="3">ทุก 3 วัน</option>
          <option value="5">ทุก 5 วัน</option>
          <option value="weekly">รายสัปดาห์ (ทุก 7 วัน)</option>
          <option value="15">ทุก 15 วัน</option>
          <option value="30">ทุก 30 วัน</option>
          <option value="monthly">รายเดือน</option>
        </select>
      </div>
    </div>
    <div className="row"><Lbl>วันจ่ายที่ลูกหนี้กำหนดเอง (ไม่บังคับ)</Lbl>
      <input type="number" min="1" max="31" className="inp num" value={f.payDay} placeholder="เช่น 15" onChange={u("payDay")}/></div>
    {f.payDay&&<div style={{fontSize:11,color:"#b07d89",marginTop:-6,marginBottom:10}}>
      💡 ลูกหนี้รายนี้จะครบกำหนดทุกวันที่ {f.payDay} ของเดือน แทนวันเริ่มต้นสัญญา
    </div>}

    {/* ── preview ตารางนัดชำระ ── */}
    {schedulePreview.rows&&schedulePreview.rows.length>0&&(
      <div className="row" style={{background:"#fff8fb",borderRadius:12,border:"1px solid #ffdce3",padding:"10px 12px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#8c5a65",marginBottom:6}}>
          📅 ตัวอย่างวันนัดชำระ (งวดละ ฿{fmt(schedulePreview.per)})
        </div>
        {schedulePreview.rows.map(r=>(
          <div key={r.no} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#b07d89",padding:"2px 0"}}>
            <span>งวดที่ {r.no}</span><span>{thD(r.date)}</span>
          </div>
        ))}
        {schedulePreview.n>6&&<div style={{fontSize:10,color:"#b07d89",marginTop:2}}>...และอีก {schedulePreview.n-6} งวด</div>}
      </div>
    )}

    <div className="row"><Lbl>หมายเหตุ</Lbl><input className="inp" value={f.note} placeholder="(ไม่บังคับ)" onChange={u("note")}/></div>
    <Btn full onClick={save}>{data?"บันทึกการแก้ไข":"บันทึกบัญชี"}</Btn>
  </Modal>;
}
function ScheduleModal({debt,onSave,onClose}){
  const ex=debt.schedule||{};
  const [f,setF]=useState({payMode:ex.payMode||"principal_interest",freq:ex.freq||"monthly",startDate:ex.startDate||debt.startDate||td(),customDates:ex.customDates||[]});
  const [nd,setNd]=useState(td());const [na,setNa]=useState("");const [nl,setNl]=useState("");
  function addCD(){if(!nd||!na){alert("กรอกวันที่และยอด");return;}
    setF(x=>({...x,customDates:[...x.customDates,{date:nd,amount:+na,label:nl}].sort((a,b)=>a.date.localeCompare(b.date))}));
    setNd(td());setNa("");setNl("");}
  return <Modal title="⏰ ตั้งตารางนัดชำระ" onClose={onClose} wide>
    <div className="row"><Lbl req>รูปแบบการชำระ</Lbl>
      <select className="inp" value={f.payMode} onChange={e=>setF(x=>({...x,payMode:e.target.value}))}>
        {PAY_MODES.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}
      </select>
    </div>
    {f.payMode==="interest_only"&&<div style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:12,padding:"10px 13px",marginBottom:12,fontSize:12,color:"#92400e"}}>
      💡 จ่ายแต่ดอก — ยอดต้นไม่ลด จนกว่าจะโอนชำระต้นทีหลัง
    </div>}
    <div className="row"><Lbl req>ความถี่</Lbl>
      <select className="inp" value={f.freq} onChange={e=>setF(x=>({...x,freq:e.target.value}))}>
        {FREQ.map(fr=><option key={fr.v} value={fr.v}>{fr.l}</option>)}
      </select>
    </div>
    {f.freq!=="custom"&&<div className="row"><Lbl req>วันเริ่มต้น</Lbl>
      <input type="date" className="inp" value={f.startDate} onChange={e=>setF(x=>({...x,startDate:e.target.value}))}/>
    </div>}
    {f.freq==="custom"&&<div>
      <div style={{fontWeight:700,fontSize:12,color:"#b07d89",marginBottom:8}}>📅 เพิ่มวันนัดชำระ</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
        <input type="date" className="inp" style={{fontSize:12}} value={nd} onChange={e=>setNd(e.target.value)}/>
        <input type="number" className="inp num" style={{fontSize:12}} value={na} placeholder="ยอด (฿)" onChange={e=>setNa(e.target.value)}/>
        <input className="inp" style={{fontSize:12}} value={nl} placeholder="หมายเหตุ" onChange={e=>setNl(e.target.value)}/>
      </div>
      <Btn sm color="#e07a8f" onClick={addCD}>+ เพิ่มวัน</Btn>
      {f.customDates.length>0&&<div style={{marginTop:10,maxHeight:160,overflowY:"auto"}}>
        {f.customDates.map((cd,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,padding:"4px 0",borderBottom:"1px solid #fff0f3"}}>
          <span>{cd.date} — ฿{fmt(cd.amount)} {cd.label&&`· ${cd.label}`}</span>
          <button onClick={()=>setF(x=>({...x,customDates:x.customDates.filter((_,j)=>j!==i)}))}
            style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#ef4444"}}>ลบ</button>
        </div>)}
      </div>}
    </div>}
    <div style={{marginTop:14}}><Btn full color="#e07a8f" onClick={()=>onSave(f)}>บันทึกตารางนัด</Btn></div>
  </Modal>;
}

function StartBalModal({current,onSave,onClose}){

function BillModal({data,customers,debts,dStats,custMap,onSave,onClose}){

    customerId:data?.customerId||"",
    dueDate:data?.dueDate||"",
    note:data?.note||"",
    items:data?.items||[{desc:"",qty:1,price:""}],
  });
  function addItem(){setF(x=>({...x,items:[...x.items,{desc:"",qty:1,price:""}]}))}
  function rmItem(i){setF(x=>({...x,items:x.items.filter((_,j)=>j!==i)}))}
  function setItem(i,k,v){setF(x=>({...x,items:x.items.map((it,j)=>j===i?{...it,[k]:v}:it)}))}
  const total=f.items.reduce((s,x)=>s+(+x.qty||1)*(+x.price||0),0);
  function autoFill(){
    if(!f.customerId)return;
    const cDebts=debts.filter(d=>d.customerId===f.customerId);
    const newItems=cDebts.filter(d=>dStats[d.id]?.remaining>0).map(d=>({
      desc:`งวดผ่อน${d.note?` (${d.note})`:""}`,
      qty:1,
      price:Math.min(dStats[d.id].installAmt,dStats[d.id].remaining),
      debtId:d.id  // ผูกกับบัญชีหนี้จริง — ให้ระบบรู้ว่าถ้าจ่ายแล้วต้องบันทึกลดยอดหนี้ไหน
    }));
    if(newItems.length)setF(x=>({...x,items:newItems}));

  }
  function save(){
    if(!f.customerId){alert("กรุณาเลือกลูกค้า");return;}
    if(!f.items.length||!f.items[0].desc){alert("กรุณาใส่รายการอย่างน้อย 1 รายการ");return;}

      </select>
    </Row2>
    <Row2 label="วันครบกำหนดชำระ">
      <input type="date" className="inp" value={f.dueDate} onChange={e=>setF(x=>({...x,dueDate:e.target.value}))}/>
    </Row2>
    {/* auto-fill */}
    {f.customerId&&<button onClick={autoFill} style={{background:"#fff0f3",border:"1px solid #ffdce3",
        borderRadius:9,padding:"6px 12px",fontSize:12,color:"#e07a8f",fontWeight:700,cursor:"pointer",
        width:"100%",marginBottom:10}}>
      ✨ ดึงยอดผ่อนค้างอัตโนมัติ

    {/* items */}
    <div style={{fontWeight:700,fontSize:12,color:"#8c5a65",marginBottom:6}}>รายการ</div>

        <div style={{position:"relative"}}>
          <input className="inp" style={{fontSize:12,paddingRight:it.debtId?26:13}} placeholder="รายการ" value={it.desc}
            onChange={e=>setItem(i,"desc",e.target.value)}/>
          {it.debtId&&<span title="ผูกกับบัญชีหนี้ — ถ้ารับชำระ ระบบจะบันทึกลดยอดหนี้อัตโนมัติ"
              style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",fontSize:12}}>🔗</span>}

  </Modal>;

// LOGIN GATE — ตั้งรหัสผ่านเข้าเว็บ (ใช้คนเดียว, เก็บใน localStorage)
// ══════════════════════════════════════════════════════════════
const ss={
  get:(k)=>{try{return sessionStorage.getItem(k)}catch(_){return null}},
  set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(_){}},
  del:(k)=>{try{sessionStorage.removeItem(k)}catch(_){}},
};
function LoginGate(){
  const [user,setUser]=useState(null);       // firebase user object เมื่อ login สำเร็จ
  const [authReady,setAuthReady]=useState(false); // เช็คสถานะ login เสร็จหรือยัง (กันจอกระพริบ)
  const [dataReady,setDataReady]=useState(false);  // โหลดข้อมูลจาก Firestore เสร็จหรือยัง
  const [mode,setMode]=useState("login");     // login | signup
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [fbConfigured,setFbConfigured]=useState(true);

  useEffect(()=>{document.body.dataset.theme=load("theme","light");document.body.dataset.accent=load("accent","pink");document.body.dataset.preset=load("preset","pink");},[]);

  // เช็คว่า config Firebase ถูกแก้ค่าจริงหรือยัง (ยังเป็นค่า placeholder อยู่ไหม)
  // และรอให้ Firebase SDK init เสร็จจริงๆ ก่อนแตะ window.fbAuth (กันเน็ตช้าแล้ว SDK โหลดไม่ทัน)
  useEffect(()=>{
    if(!window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey?.includes("วางค่า")){
      setFbConfigured(false);setAuthReady(true);return;
    }
    let unsub=null;
    function startAuthListener(){
      if(window.fbInitError){
        setFbConfigured("error");setAuthReady(true);return;
      }
      if(!window.fbAuth){
        // ยังไม่พร้อมจริงๆ (ไม่ควรเกิดถ้า firebaseReady ยิงถูกต้อง แต่กันเหนียวไว้)
        setTimeout(startAuthListener,200);return;
      }
      unsub=window.fbAuth.onAuthStateChanged(async(u)=>{
        setUser(u);
        setAuthReady(true);
        if(u){
          setDataReady(false);
          await loadAllFromFirestore(u.uid);
          setDataReady(true);
        }
      });
    }
    if(window.fbAuth||window.fbInitError){
      startAuthListener(); // Firebase พร้อมอยู่แล้วตอน mount
    }else{
      window.addEventListener("firebaseReady",startAuthListener,{once:true});
    }
    return ()=>{
      window.removeEventListener("firebaseReady",startAuthListener);
      if(unsub)unsub();
    };
  },[]);

  async function doSignup(){
    setErr("");
    if(!email||!pass){setErr("กรอกอีเมลและรหัสผ่านให้ครบ");return;}
    if(pass.length<6){setErr("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");return;}
    setBusy(true);
    try{
      await window.fbAuth.createUserWithEmailAndPassword(email,pass);
    }catch(e){
      setErr(e.code==="auth/email-already-in-use"?"อีเมลนี้มีบัญชีอยู่แล้ว — ลองเข้าสู่ระบบแทน":
        e.code==="auth/invalid-email"?"รูปแบบอีเมลไม่ถูกต้อง":
        e.code==="auth/weak-password"?"รหัสผ่านสั้นเกินไป":e.message);
    }
    setBusy(false);
  }
  async function doLogin(){
    setErr("");
    if(!email||!pass){setErr("กรอกอีเมลและรหัสผ่านให้ครบ");return;}
    setBusy(true);
    try{
      await window.fbAuth.signInWithEmailAndPassword(email,pass);
    }catch(e){
      setErr(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found"?
        "อีเมลหรือรหัสผ่านไม่ถูกต้อง":e.message);
    }
    setBusy(false);
  }
  async function doLogout(){
    await window.fbAuth.signOut();
    window._fbUid=null;window._fbCache={};
    setDataReady(false);
  }

  const wrap={minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
    background:"#ffe4eb",padding:20};
  const box={background:"#fff",borderRadius:24,padding:"32px 26px",width:"100%",maxWidth:380,
    boxShadow:"0 20px 60px rgba(224,122,143,.25)",textAlign:"center"};
  const inp={width:"100%",padding:"12px 16px",border:"2px solid #ffdce3",borderRadius:14,
    fontSize:14,outline:"none",marginBottom:10,fontFamily:"Mitr,sans-serif",color:"#8c5a65"};

  // ── ยังไม่ได้ตั้งค่า Firebase — แจ้งเตือนวิธีตั้งค่าแทนที่จะพังเงียบๆ ──
  if(fbConfigured===false){
    return<div style={wrap}><div style={box}>
      <div style={{fontSize:44,marginBottom:8}}>🔧</div>
      <div style={{fontWeight:800,fontSize:17,color:"#8c5a65",marginBottom:10}}>ยังไม่ได้ตั้งค่า Firebase</div>
      <div style={{fontSize:12,color:"#b07d89",marginBottom:16,textAlign:"left",lineHeight:1.7}}>
        ก่อนใช้งาน ต้องตั้งค่า Firebase เพื่อให้ข้อมูลซิงค์ข้ามเครื่องได้:<br/><br/>
        1. สร้างโปรเจกต์ที่ <b>console.firebase.google.com</b><br/>
        2. เปิดใช้ <b>Authentication → Email/Password</b><br/>
        3. เปิดใช้ <b>Firestore Database</b><br/>
        4. คัดลอก Config มาแก้ในไฟล์ HTML นี้<br/>
        &nbsp;&nbsp;&nbsp;ตรงตัวแปร <code>FIREBASE_CONFIG</code> ด้านบนสุดของไฟล์
      </div>
      <div style={{background:"#fff0f3",borderRadius:10,padding:10,fontSize:11,color:"#8c5a65"}}>
        💡 ระหว่างนี้ข้อมูลจะถูกเก็บไว้ในเครื่องนี้เท่านั้น (localStorage) จนกว่าจะตั้งค่า Firebase เสร็จ
      </div>
      <button onClick={()=>{window._fbUid=null;setFbConfigured("skip");}} style={{width:"100%",
          background:"linear-gradient(135deg,#e07a8f,#ffb5c6)",color:"#fff",border:"none",
          borderRadius:14,padding:13,fontSize:14,fontWeight:800,cursor:"pointer",marginTop:16}}>
        ใช้งานแบบเครื่องเดียวไปก่อน →
      </button>
    </div></div>;
  }
  if(fbConfigured==="error"){
    return<div style={wrap}><div style={box}>
      <div style={{fontSize:44,marginBottom:8}}>📡</div>
      <div style={{fontWeight:800,fontSize:17,color:"#8c5a65",marginBottom:10}}>เชื่อมต่อ Firebase ไม่สำเร็จ</div>
      <div style={{fontSize:12,color:"#b07d89",marginBottom:16,lineHeight:1.7}}>
        {window.fbInitError||"ไม่สามารถโหลด Firebase SDK ได้"}<br/><br/>
        สาเหตุที่เป็นไปได้: อินเทอร์เน็ตช้าหรือไม่เสถียร, เครือข่ายบล็อก gstatic.com, หรือตั้งค่า Config ผิด
      </div>
      <button onClick={()=>location.reload()} style={{width:"100%",
          background:"linear-gradient(135deg,#e07a8f,#ffb5c6)",color:"#fff",border:"none",
          borderRadius:14,padding:13,fontSize:14,fontWeight:800,cursor:"pointer"}}>
        🔄 ลองโหลดใหม่
      </button>
      <button onClick={()=>{window._fbUid=null;setFbConfigured("skip");}} style={{width:"100%",
          background:"none",border:"none",color:"#b07d89",fontSize:11,marginTop:12,
          cursor:"pointer",textDecoration:"underline"}}>
        หรือใช้งานแบบเครื่องเดียวไปก่อน →
      </button>
    </div></div>;
  }
  if(fbConfigured==="skip")return<App/>;

  if(!authReady)return<div style={wrap}><div style={{fontSize:14,color:"#b07d89"}}>⏳ กำลังตรวจสอบสถานะเข้าสู่ระบบ...</div></div>;

  // ── login แล้วแต่ยังโหลดข้อมูลจาก Firestore ไม่เสร็จ ──
  if(user&&!dataReady){
    return<div style={wrap}><div style={box}>
      <div style={{fontSize:36,marginBottom:10}}>☁️</div>
      <div style={{fontWeight:800,fontSize:15,color:"#8c5a65",marginBottom:6}}>กำลังซิงค์ข้อมูล...</div>
      <div style={{fontSize:12,color:"#b07d89"}}>ดึงข้อมูลล่าสุดจากทุกอุปกรณ์ของคุณ</div>
    </div></div>;
  }

  if(user&&dataReady)return<App onLock={doLogout} userEmail={user.email}/>;

  // ── หน้า login/signup ──
  return<div style={wrap}><div style={box}>
    <div style={{fontSize:44,marginBottom:8}}>☁️</div>
    <div style={{fontWeight:800,fontSize:18,color:"#8c5a65",marginBottom:4}}>ระบบบัญชีเครดิต</div>
    <div style={{fontSize:12,color:"#b07d89",marginBottom:20}}>เข้าสู่ระบบเพื่อใช้งานได้ทุกอุปกรณ์</div>

    <div style={{display:"flex",gap:6,marginBottom:16,background:"#fff0f3",borderRadius:12,padding:4}}>
      {[["login","เข้าสู่ระบบ"],["signup","สมัครใหม่"]].map(([m,l])=>(
        <button key={m} onClick={()=>{setMode(m);setErr("")}} style={{flex:1,padding:"8px",
            borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,
            background:mode===m?"#fff":"transparent",color:mode===m?"#e07a8f":"#b07d89",
            boxShadow:mode===m?"0 1px 4px rgba(0,0,0,.08)":"none"}}>{l}</button>
      ))}
    </div>

    <input type="email" style={inp} placeholder="อีเมล" value={email}
      onChange={e=>{setEmail(e.target.value);setErr("")}}
      onKeyDown={e=>e.key==="Enter"&&(mode==="login"?doLogin():doSignup())}/>
    <input type="password" style={inp} placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" value={pass}
      onChange={e=>{setPass(e.target.value);setErr("")}}
      onKeyDown={e=>e.key==="Enter"&&(mode==="login"?doLogin():doSignup())}/>
    {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10,fontWeight:600,textAlign:"left"}}>⚠️ {err}</div>}

    <button onClick={mode==="login"?doLogin:doSignup} disabled={busy}
        style={{width:"100%",background:busy?"#ffd1dc":"linear-gradient(135deg,#e07a8f,#ffb5c6)",
        color:"#fff",border:"none",borderRadius:14,padding:14,fontSize:15,fontWeight:800,
        cursor:busy?"default":"pointer",marginTop:6}}>
      {busy?"⏳ กำลังดำเนินการ...":mode==="login"?"🔓 เข้าสู่ระบบ":"✅ สมัครสมาชิก"}
    </button>

    <div style={{fontSize:11,color:"#b07d89",marginTop:16,lineHeight:1.6}}>
      💡 ล็อกอินด้วยอีเมลเดียวกันจากเครื่องไหนก็ได้<br/>ข้อมูลจะซิงค์ให้อัตโนมัติ
    </div>
  </div></div>;
}

class ErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(err){return{err}}
  render(){
    if(this.state.err){
      return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
          background:"#ffe4eb",padding:20,fontFamily:"Mitr,sans-serif"}}>
        <div style={{background:"#fff",borderRadius:20,padding:24,maxWidth:360,textAlign:"center",
            boxShadow:"0 20px 60px rgba(224,122,143,.25)"}}>
          <div style={{fontSize:40,marginBottom:10}}>😵</div>
          <div style={{fontWeight:800,color:"#8c5a65",marginBottom:8}}>เกิดข้อผิดพลาด</div>
          <div style={{fontSize:12,color:"#b07d89",marginBottom:16,wordBreak:"break-word"}}>
            {String(this.state.err?.message||this.state.err)}
          </div>
          <button onClick={()=>location.reload()} style={{background:"linear-gradient(135deg,#e07a8f,#ffb5c6)",
              color:"#fff",border:"none",borderRadius:12,padding:"10px 20px",fontWeight:700,cursor:"pointer"}}>
            🔄 โหลดใหม่
          </button>
        </div>
      </div>;
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrBoundary><LoginGate/></ErrBoundary>);
// React mount สำเร็จแล้ว (ถ้าโค้ดมาถึงบรรทัดนี้ได้แปลว่าไม่มี error ระดับ script) — ซ่อนหน้าจอ "กำลังโหลด"
if(window.hideBootStatus) window.hideBootStatus();
</script>
</body>
</html>
